<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1152" width="1200" height="1152" role="img" aria-label="Five conditions that narrow the candidate workflows">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1152" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 8.1 — THE SELECTION FILTER</text>
<text class="h" x="64" y="122">The selection filter</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="mut" x="64" y="196">Five conditions, each eliminating a category of problem.</text>
<text class="gold" x="64" y="272" style="font-size:48px;font-weight:700">~50</text>
<text class="cap" x="190" y="266" style="fill:#55565D">CANDIDATE WORKFLOWS AT ONE SITE</text>
<rect x="64" y="316" width="1072" height="36" fill="#D2D1CD"/><rect x="64" y="316" width="858" height="36" fill="#B8952B"/>
<text class="lab" x="64" y="390" style="font-size:23px">1 · Small scope: one team, one site, one process</text>
<text class="red" x="64" y="420" style="font-size:20px;font-style:italic">Eliminates: platforms, cross-functional initiatives</text>
<rect x="64" y="442" width="1072" height="36" fill="#D2D1CD"/><rect x="64" y="442" width="643" height="36" fill="#B8952B"/>
<text class="lab" x="64" y="516" style="font-size:23px">2 · Adjacent to money: affects cash, not just efficiency</text>
<text class="red" x="64" y="546" style="font-size:20px;font-style:italic">Eliminates: reporting, dashboards, analytics</text>
<rect x="64" y="568" width="1072" height="36" fill="#D2D1CD"/><rect x="64" y="568" width="429" height="36" fill="#B8952B"/>
<text class="lab" x="64" y="642" style="font-size:23px">3 · One hungry owner: answers at 10 PM</text>
<text class="red" x="64" y="672" style="font-size:20px;font-style:italic">Eliminates: committee-owned processes</text>
<rect x="64" y="694" width="1072" height="36" fill="#D2D1CD"/><rect x="64" y="694" width="322" height="36" fill="#B8952B"/>
<text class="lab" x="64" y="768" style="font-size:23px">4 · Presence: operator can sit with the team</text>
<text class="red" x="64" y="798" style="font-size:20px;font-style:italic">Eliminates: distributed, multi-site, remote-only</text>
<rect x="64" y="820" width="1072" height="36" fill="#D2D1CD"/><rect x="64" y="820" width="214" height="36" fill="#B8952B"/>
<text class="lab" x="64" y="894" style="font-size:23px">5 · System of record: closes the old path</text>
<text class="red" x="64" y="924" style="font-size:20px;font-style:italic">Eliminates: side channels, parallel processes</text>
<line x1="64" y1="960" x2="1136" y2="960" stroke="#D2D1CD"/>
<text class="gold" x="64" y="1020" style="font-size:48px;font-weight:700">3–5</text>
<text class="cap" x="190" y="1014" style="fill:#55565D">DEPLOYMENTS THAT QUALIFY FOR THE FIRST ENGAGEMENT</text>
<text class="mut" x="64" y="1074">Each filter is a question. If the answer is no, you learn what to go and get,</text>
<text class="mut" x="64" y="1102">or which wound to pick instead.</text>

</g>
</svg>
