<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" role="img" aria-label="Line shaft factory versus unit drive factory">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="990" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 2.1 — THE SAME TECHNOLOGY, TWICE</text>
<text class="h" x="64" y="122">Swap the power source, or rebuild around it</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="600" y1="186" x2="600" y2="800" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">1890s · NEW MOTOR, OLD ARCHITECTURE</text>
<text class="mut" x="64" y="242">The steam engine is replaced by</text>
<text class="mut" x="64" y="270">one large electric motor.</text>
<line x1="76" y1="340" x2="556" y2="340" stroke="#1C1D20" stroke-width="6"/>
<text class="mut end" x="556" y="322">overhead line shaft: runs or stops as one</text>
<rect x="76" y="360" width="80" height="80" fill="none" stroke="#1C1D20" stroke-width="2"/>
<line x1="116" y1="340" x2="116" y2="360" stroke="#1C1D20" stroke-width="3"/>
<text class="lab mid" x="116" y="412">M</text>
<text class="mut" x="76" y="474">one motor</text>
<line x1="204" y1="340" x2="204" y2="500" stroke="#8A8B92" stroke-width="1.6"/><line x1="236" y1="340" x2="236" y2="500" stroke="#8A8B92" stroke-width="1.6"/>
<rect x="190" y="500" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<line x1="282" y1="340" x2="282" y2="500" stroke="#8A8B92" stroke-width="1.6"/><line x1="314" y1="340" x2="314" y2="500" stroke="#8A8B92" stroke-width="1.6"/>
<rect x="268" y="500" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<line x1="360" y1="340" x2="360" y2="500" stroke="#8A8B92" stroke-width="1.6"/><line x1="392" y1="340" x2="392" y2="500" stroke="#8A8B92" stroke-width="1.6"/>
<rect x="346" y="500" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<line x1="438" y1="340" x2="438" y2="500" stroke="#8A8B92" stroke-width="1.6"/><line x1="470" y1="340" x2="470" y2="500" stroke="#8A8B92" stroke-width="1.6"/>
<rect x="424" y="500" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<line x1="516" y1="340" x2="516" y2="500" stroke="#8A8B92" stroke-width="1.6"/><line x1="548" y1="340" x2="548" y2="500" stroke="#8A8B92" stroke-width="1.6"/>
<rect x="502" y="500" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<text class="lab mid" x="220" y="540">3</text>
<text class="lab mid" x="298" y="540">1</text>
<text class="lab mid" x="376" y="540">5</text>
<text class="lab mid" x="454" y="540">2</text>
<text class="lab mid" x="532" y="540">4</text>
<text class="mut" x="64" y="626">Machines sit where the shaft can reach</text>
<text class="mut" x="64" y="654">them. Layout follows power, so the work</text>
<text class="mut" x="64" y="682">zig-zags: 3 → 1 → 5 → 2 → 4.</text>
<text class="mut" x="64" y="710">One machine cannot stop alone. The</text>
<text class="mut" x="64" y="738">building is the transmission.</text>
<text class="lab red" x="64" y="790">Result: negligible</text>
<text class="lab red" x="64" y="822">productivity gain.</text>
<text class="cap" x="660" y="206">1920s · ARCHITECTURE REBUILT</text>
<text class="mut" x="660" y="242">Every machine gets its own motor.</text>
<text class="mut" x="660" y="270">The shaft becomes unnecessary.</text>
<defs><marker id="fw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8952B"/></marker></defs>
<rect x="660" y="340" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<circle cx="720" cy="340" r="8" fill="#B8952B"/>
<text class="lab mid" x="690" y="380">1</text>
<rect x="760" y="430" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<circle cx="820" cy="430" r="8" fill="#B8952B"/>
<text class="lab mid" x="790" y="470">2</text>
<rect x="860" y="340" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<circle cx="920" cy="340" r="8" fill="#B8952B"/>
<text class="lab mid" x="890" y="380">3</text>
<rect x="960" y="430" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<circle cx="1020" cy="430" r="8" fill="#B8952B"/>
<text class="lab mid" x="990" y="470">4</text>
<rect x="1060" y="340" width="60" height="60" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2"/>
<circle cx="1120" cy="340" r="8" fill="#B8952B"/>
<text class="lab mid" x="1090" y="380">5</text>
<path d="M728 374 L752 456" stroke="#B8952B" stroke-width="3" fill="none" marker-end="url(#fw)"/>
<path d="M828 464 L852 366" stroke="#B8952B" stroke-width="3" fill="none" marker-end="url(#fw)"/>
<path d="M928 374 L952 456" stroke="#B8952B" stroke-width="3" fill="none" marker-end="url(#fw)"/>
<path d="M1028 464 L1052 366" stroke="#B8952B" stroke-width="3" fill="none" marker-end="url(#fw)"/>
<circle cx="668" cy="505" r="8" fill="#B8952B"/>
<text class="mut" x="686" y="512">own motor</text>
<text class="mut gold" x="900" y="512">→ flow of the work</text>
<text class="mut" x="660" y="626">Machines sit in the order the work</text>
<text class="mut" x="660" y="654">happens. Single storey, any width. The</text>
<text class="mut" x="660" y="682">bottleneck becomes visible, so it can</text>
<text class="mut" x="660" y="710">be balanced. Each machine starts and</text>
<text class="mut" x="660" y="738">stops alone. Roles all change.</text>
<text class="lab gold" x="660" y="790">Result: the 1920s manufacturing</text>
<text class="lab gold" x="660" y="822">productivity surge.</text>
<line x1="64" y1="844" x2="1136" y2="844" stroke="#D2D1CD"/>
<text class="lab" x="64" y="890">A chat assistant bolted to an unchanged process is the left-hand panel.</text>
<text class="mut" x="64" y="926">The motor was never the gain. The rebuild was, and it was done factory by factory,</text>
<text class="mut" x="64" y="954">by people standing on the floor.</text>

</g>
</svg>
