<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050" role="img" aria-label="Where pilots die inside an incumbent">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1050" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 3.2 — WHERE PILOTS DIE</text>
<text class="h" x="64" y="122">The dangerous moment is not failure. It is success.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="64" y1="236" x2="436" y2="236" stroke="#8A8B92" stroke-width="2"/><line x1="64" y1="236" x2="64" y2="250" stroke="#8A8B92" stroke-width="2"/><line x1="436" y1="236" x2="436" y2="250" stroke="#8A8B92" stroke-width="2"/>
<text class="cap mid" x="250" y="210" style="fill:#55565D">WHERE GOVERNANCE FILTERS</text>
<text class="mut mid" x="250" y="396">almost nothing dies here</text>
<line x1="120" y1="330" x2="900" y2="330" stroke="#1C1D20" stroke-width="3"/>
<circle cx="120" cy="330" r="10" fill="#1C1D20"/>
<text class="cap mid" x="120" y="296">IDEA</text>
<circle cx="380" cy="330" r="10" fill="#1C1D20"/>
<text class="cap mid" x="380" y="296">DEMO</text>
<circle cx="640" cy="330" r="10" fill="#1C1D20"/>
<text class="cap mid" x="640" y="296">IT WORKS</text>
<circle cx="900" cy="330" r="10" fill="#1C1D20"/>
<text class="cap mid" x="900" y="296">HANDOVER</text>
<line x1="900" y1="330" x2="1090" y2="330" stroke="#B8952B" stroke-width="3" stroke-dasharray="8 7"/>
<circle cx="1090" cy="330" r="10" fill="#B8952B"/>
<text class="cap gold end" x="1136" y="296">PRODUCTION</text>
<rect x="640" y="356" width="260" height="66" fill="#B0432D" opacity="0.14"/>
<text class="cap red mid" x="770" y="382">ORPHANED</text>
<text class="mut red mid" x="770" y="410">runs, no owner</text>
<line x1="640" y1="422" x2="640" y2="760" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="6 6"/>
<circle cx="640" cy="487" r="8" fill="#B0432D"/>
<text class="lab red end" x="612" y="494" style="font-size:22px">No owner named.</text>
<text class="mut" x="668" y="494">Every roadmap was set before</text>
<text class="mut" x="668" y="522">it existed.</text>
<circle cx="640" cy="579" r="8" fill="#B0432D"/>
<text class="lab red end" x="612" y="586" style="font-size:22px">Support decays.</text>
<text class="mut" x="668" y="586">Response slips from hours to weeks;</text>
<text class="mut" x="668" y="614">usage goes to zero in two quarters.</text>
<circle cx="640" cy="671" r="8" fill="#B0432D"/>
<text class="lab red end" x="612" y="678" style="font-size:22px">Rebuild proposed.</text>
<text class="mut" x="668" y="678">Scoped, estimated, prioritised,</text>
<text class="mut" x="668" y="706">never started.</text>
<circle cx="640" cy="763" r="8" fill="#B0432D"/>
<text class="lab red end" x="612" y="770" style="font-size:22px">The champion moves.</text>
<text class="mut" x="668" y="770">Nobody kills it; it is un-championed,</text>
<text class="mut" x="668" y="798">which is slower and more final.</text>
<line x1="64" y1="850" x2="1136" y2="850" stroke="#D2D1CD"/>
<text class="lab gold" x="64" y="894">The only version that survives is the one an owner with real standing took before it</text>
<text class="lab gold" x="64" y="926">was offered, into a budget line and a team with a support rota.</text>
<text class="mut" x="64" y="966">This never happens by process. Plan the handover before the build.</text>
<text class="mut" x="64" y="994">If you cannot name the owner, you are building a future orphan.</text>

</g>
</svg>
