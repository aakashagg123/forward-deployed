<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Four structural factors that make India unusually fertile ground">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#6A6B72}
.lbl{font-size:16px;fill:#1C1D20}
.note{font-size:13px;fill:#7A7B82}
.num{font-size:13px;letter-spacing:1.4px;fill:#B8952B}
</style>
<rect width="1200" height="660" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 15.1 — FOUR STRUCTURAL FACTORS</text>
<text class="t h" x="64" y="112">No single factor explains the fit. The combination does.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<!-- Four quadrant cards -->
<rect x="64" y="180" width="516" height="200" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t num" x="88" y="212">01 · ENTERPRISE DENSITY</text>
<text class="t lbl" x="88" y="242">The conglomerate structure</text>
<text class="t note" x="88" y="268">Dozens of operating companies under</text>
<text class="t note" x="88" y="286">one family's trust relationship —</text>
<text class="t note" x="88" y="304">expansion terrain no single-business</text>
<text class="t note" x="88" y="322">Western enterprise offers.</text>

<rect x="620" y="180" width="516" height="200" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t num" x="644" y="212">02 · WORKFLOW MULTIPLICITY</text>
<text class="t lbl" x="644" y="242">Compressed-timeframe digitisation</text>
<text class="t note" x="644" y="268">Waves of ERP adoption layered fast,</text>
<text class="t note" x="644" y="286">not rationalised — more unreconciled</text>
<text class="t note" x="644" y="304">seams per enterprise than economies</text>
<text class="t note" x="644" y="322">that industrialised more slowly.</text>

<rect x="64" y="400" width="516" height="200" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t num" x="88" y="432">03 · TALENT SUPPLY</text>
<text class="t lbl" x="88" y="462">Volume near the intersection</text>
<text class="t note" x="88" y="488">Not more brilliant engineers —</text>
<text class="t note" x="88" y="506">more people, in absolute numbers,</text>
<text class="t note" x="88" y="524">near Chapter 11's rare intersection,</text>
<text class="t note" x="88" y="542">across all five talent sources.</text>

<rect x="620" y="400" width="516" height="200" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t num" x="644" y="432">04 · COST STRUCTURE</text>
<text class="t lbl" x="644" y="462">Favourable base-plus-share economics</text>
<text class="t note" x="644" y="488">Low base cost, proportionally large</text>
<text class="t note" x="644" y="506">value created — the most transferable</text>
<text class="t note" x="644" y="524">factor, and the least sufficient</text>
<text class="t note" x="644" y="542">on its own.</text>

<line x1="64" y1="628" x2="1136" y2="628" stroke="#D2D1CD"/>
</svg>
