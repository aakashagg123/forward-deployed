<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The base-plus-value-share pricing model">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#6A6B72}
.note{font-size:13px;fill:#7A7B82}
.lbl{font-size:16px;fill:#1C1D20}
.num{font-size:28px;fill:#1C1D20}
.unit{font-size:14px;fill:#6A6B72}
</style>
<rect width="1200" height="640" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 13.3 — THE PRICING MODEL</text>
<text class="t h" x="64" y="112">Revenue follows impact, not headcount.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<!-- Left: the structure -->
<text class="t col" x="64" y="200">THE STRUCTURE</text>
<line x1="64" y1="216" x2="500" y2="216" stroke="#D2D1CD"/>

<!-- Base fee box -->
<rect x="64" y="240" width="420" height="100" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t lbl" x="84" y="272">Base fee</text>
<text class="t note" x="84" y="296">Covers operator cost during deployment</text>
<text class="t note" x="84" y="316">Low enough for procurement to approve</text>

<!-- Plus sign -->
<text class="t" x="274" y="370" text-anchor="middle" font-size="24" fill="#6A6B72">+</text>

<!-- Value share box -->
<rect x="64" y="390" width="420" height="100" rx="8" fill="#B8952B" opacity="0.10" stroke="#B8952B"/>
<text class="t lbl" x="84" y="422" fill="#B8952B">Value share</text>
<text class="t note" x="84" y="446">Percentage of measured outcome over defined period</text>
<text class="t note" x="84" y="466">Aligns operator incentive with client outcome</text>

<!-- Right: example -->
<text class="t col" x="600" y="200">EXAMPLE · DEALER RECONCILIATION</text>
<line x1="600" y1="216" x2="1136" y2="216" stroke="#D2D1CD"/>

<!-- Deployment cost -->
<rect x="600" y="240" width="240" height="120" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t unit" x="620" y="268">DEPLOYMENT</text>
<text class="t num" x="620" y="306">₹12L</text>
<text class="t note" x="620" y="334">12-week operator cost</text>

<!-- Outcome -->
<rect x="860" y="240" width="276" height="120" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t unit" x="880" y="268">ANNUAL OUTCOME</text>
<text class="t num" x="880" y="306">₹2Cr</text>
<text class="t note" x="880" y="334">Working capital released</text>

<!-- Value share calc -->
<rect x="600" y="390" width="536" height="100" rx="8" fill="#B8952B" opacity="0.10" stroke="#B8952B"/>
<text class="t unit" x="620" y="418" fill="#B8952B">VALUE SHARE (20% OVER 3 YEARS)</text>
<text class="t num" x="620" y="456" fill="#B8952B">₹1.2Cr</text>
<text class="t note" x="820" y="456">Total revenue from one deployment</text>

<!-- Bottom comparison -->
<line x1="64" y1="530" x2="1136" y2="530" stroke="#D2D1CD"/>

<rect x="64" y="548" width="500" height="32" rx="4" fill="#EBEAE6"/>
<text class="t note" x="84" y="570">Consulting model: revenue = billing rate × headcount × utilisation</text>

<rect x="600" y="548" width="536" height="32" rx="4" fill="#B8952B" opacity="0.10"/>
<text class="t note" x="620" y="570" fill="#B8952B">Forward-deployed: revenue = base + (outcome × share %  × years)</text>

<text class="t" x="64" y="620" font-size="16" fill="#4A4B50">The constraint is not demand. The constraint is the number of operators who can deliver.</text>
</svg>
