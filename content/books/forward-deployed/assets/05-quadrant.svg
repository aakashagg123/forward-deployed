<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1112" width="1200" height="1112" role="img" aria-label="Proximity to the work versus authority to change the path">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1112" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 5.1 — THE TWO HALVES OF THE ANSWER</text>
<text class="h" x="64" y="122">Every enterprise has one half.</text>
<text class="h" x="64" y="164">Neither half has ever fixed anything.</text>
<line x1="64" y1="194" x2="1136" y2="194" stroke="#D2D1CD"/>
<g transform="translate(0,42)">
<text class="cap" x="64" y="200">PROXIMITY TO THE WORK ↑</text>
<rect x="64" y="216" width="1072" height="600" fill="none" stroke="#8A8B92" stroke-width="2"/><line x1="600" y1="216" x2="600" y2="816" stroke="#8A8B92" stroke-width="2"/><line x1="64" y1="516" x2="1136" y2="516" stroke="#8A8B92" stroke-width="2"/>
<rect x="600" y="216" width="536" height="300" fill="#B8952B" fill-opacity=".14" stroke="#B8952B" stroke-width="3"/>
<text class="cap" x="92" y="260">THE PERSON WHO ALREADY KNOWS</text>
<text class="mut" x="92" y="296">Tells you exactly what is broken in</text>
<text class="mut" x="92" y="324">twenty minutes. Has a perfect map of</text>
<text class="mut" x="92" y="352">the dysfunction. Owns nothing that</text>
<text class="mut" x="92" y="380">would have to change.</text>
<text class="lab red" x="92" y="422" style="font-size:21px">Describes the fire to someone not</text>
<text class="lab red" x="92" y="450" style="font-size:21px">allowed to carry water.</text>
<text class="cap gold" x="628" y="260">THE DEPLOYED OPERATOR</text>
<text class="mut" x="628" y="296">Sees the exception cases because</text>
<text class="mut" x="628" y="324">they sit there. Builds the fix without</text>
<text class="mut" x="628" y="352">joining a queue. Can close the old</text>
<text class="mut" x="628" y="380">path, and does.</text>
<text class="lab gold" x="628" y="422" style="font-size:21px">The change survives their departure</text>
<text class="lab gold" x="628" y="450" style="font-size:21px">from the room.</text>
<text class="cap" x="92" y="560">THE ANALYST</text>
<text class="mut" x="92" y="596">Infers the process from documents</text>
<text class="mut" x="92" y="624">and interviews. Produces the seventy-</text>
<text class="mut" x="92" y="652">percent version of the truth.</text>
<text class="lab red" x="92" y="694" style="font-size:21px">Output: the report.</text>
<text class="cap" x="628" y="560">THE EXECUTIVE MANDATE</text>
<text class="mut" x="628" y="596">Real authority. Real urgency. Real money.</text>
<text class="mut" x="628" y="624">Six layers from the screen; has never</text>
<text class="mut" x="628" y="652">seen it.</text>
<text class="lab red" x="628" y="694" style="font-size:21px">Output: the memo. Then the</text>
<text class="lab red" x="628" y="722" style="font-size:21px">transformation office.</text>
<text class="cap end" x="1136" y="858">AUTHORITY TO CHANGE THE PATH →</text>
<line x1="64" y1="892" x2="1136" y2="892" stroke="#D2D1CD"/>
<text class="lab" x="64" y="938" style="font-size:22px">Remove any one property and you get a role that already exists and already fails:</text>
<text class="body" x="64" y="988" style="font-weight:700">No build capability</text>
<text class="mut" x="64" y="1018">→ business analyst</text>
<text class="body" x="336" y="988" style="font-weight:700">No proximity</text>
<text class="mut" x="336" y="1018">→ platform team</text>
<text class="body" x="608" y="988" style="font-weight:700">No authority</text>
<text class="mut" x="608" y="1018">→ innovation lab</text>
<text class="body" x="880" y="988" style="font-weight:700">No accountability</text>
<text class="mut" x="880" y="1018">→ consultant, vendor</text>

</g>
</svg>
