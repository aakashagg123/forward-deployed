<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-label="What the transformation office produces versus what the work needs">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="810" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 1.1 — THE TWO LEDGERS</text>
<text class="h" x="64" y="122">Both columns are real work. They never reconcile.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206">WHAT THE OFFICE PRODUCES</text>
<text class="cap" x="620" y="206">WHAT THE WORK NEEDS</text>
<line x1="64" y1="228" x2="520" y2="228" stroke="#B9B8B4"/>
<line x1="620" y1="228" x2="1136" y2="228" stroke="#B9B8B4"/>
<line x1="570" y1="186" x2="570" y2="690" stroke="#D2D1CD"/>
<circle cx="570" cy="440" r="24" fill="#F7F6F3" stroke="#B9B8B4"/>
<text class="lab red mid" x="570" y="449">≠</text>
<text class="body" x="64" y="282" style="fill:#5F6067">The strategy deck</text>
<text class="body" x="620" y="282" style="font-weight:700">A field in the form, changed</text>
<text class="body" x="64" y="348" style="fill:#5F6067">The target operating model</text>
<text class="body" x="620" y="348" style="font-weight:700">The old path, switched off</text>
<text class="body" x="64" y="414" style="fill:#5F6067">The maturity score</text>
<text class="body" x="620" y="414" style="font-weight:700">One approval removed, by name</text>
<text class="body" x="64" y="480" style="fill:#5F6067">The roadmap</text>
<text class="body" x="620" y="480" style="font-weight:700">A duplicate customer record, merged</text>
<text class="body" x="64" y="546" style="fill:#5F6067">The governance cadence</text>
<text class="body" x="620" y="546" style="font-weight:700">An owner with a support rota</text>
<text class="body" x="64" y="612" style="fill:#5F6067">The adoption dashboard</text>
<text class="body" x="620" y="612" style="font-weight:700">A metric someone is graded on</text>
<text class="body" x="64" y="678" style="fill:#5F6067">The change communications plan</text>
<text class="body" x="620" y="678" style="font-weight:700">A person told to stop doing the old thing</text>

</g>
<line x1="64" y1="734" x2="1136" y2="734" stroke="#D2D1CD"/>
<text class="note" x="64" y="774">Nothing on the left is dishonest. Nothing on the left is change.</text>
</svg>
