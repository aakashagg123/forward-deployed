<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="Four diagnostics an operator asks in the first week">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="960" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 8.3 — WHERE WOUNDS LIVE</text>
<text class="h" x="64" y="122">Where wounds live: four diagnostics</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="mut" x="64" y="196">Each diagnostic is a question an operator asks in the first week at a site.</text>
<rect x="64" y="226" width="520" height="320" rx="6" fill="#ECEBE7"/>
<text class="lab gold" x="92" y="272">Follow the re-keying</text>
<text class="body" x="92" y="310" style="font-style:italic">“Where is data entered twice?”</text>
<text class="mut" x="92" y="350" style="fill:#1C1D20;font-size:20px">Any manual transcription between systems</text>
<text class="mut" x="92" y="377" style="fill:#1C1D20;font-size:20px">is a wound. Hours lost, errors introduced,</text>
<text class="mut" x="92" y="404" style="fill:#1C1D20;font-size:20px">accepted as normal because no one with</text>
<text class="mut" x="92" y="431" style="fill:#1C1D20;font-size:20px">build capability ever stood close enough.</text>
<text class="mut" x="92" y="480" style="font-size:19px">e.g. Branch re-enters dealer orders into</text>
<text class="mut" x="92" y="505" style="font-size:19px">ERP because the dealer management</text>
<text class="mut" x="92" y="530" style="font-size:19px">system does not integrate</text>
<rect x="616" y="226" width="520" height="320" rx="6" fill="#ECEBE7"/>
<text class="lab gold" x="644" y="272">Follow the WhatsApp group</text>
<text class="body" x="644" y="310" style="font-style:italic">“Where has the process moved to chat?”</text>
<text class="mut" x="644" y="350" style="fill:#1C1D20;font-size:20px">Every workflow on WhatsApp migrated there</text>
<text class="mut" x="644" y="377" style="fill:#1C1D20;font-size:20px">because the formal system is too slow or</text>
<text class="mut" x="644" y="404" style="fill:#1C1D20;font-size:20px">too rigid. The gap between the chat and</text>
<text class="mut" x="644" y="431" style="fill:#1C1D20;font-size:20px">the system is the wound.</text>
<text class="mut" x="644" y="480" style="font-size:19px">e.g. Dealer order confirmed via WhatsApp</text>
<text class="mut" x="644" y="505" style="font-size:19px">thumbs-up, ERP updated hours or days</text>
<text class="mut" x="644" y="530" style="font-size:19px">later, sometimes never</text>
<rect x="64" y="576" width="520" height="320" rx="6" fill="#ECEBE7"/>
<text class="lab gold" x="92" y="622">Follow the month-end panic</text>
<text class="body" x="92" y="660" style="font-style:italic">“What breaks in the last five days?”</text>
<text class="mut" x="92" y="700" style="fill:#1C1D20;font-size:20px">Processes that work for 25 days and break</text>
<text class="mut" x="92" y="727" style="fill:#1C1D20;font-size:20px">catastrophically at month-end. Volume spikes</text>
<text class="mut" x="92" y="754" style="fill:#1C1D20;font-size:20px">expose manual workarounds that were</text>
<text class="mut" x="92" y="781" style="fill:#1C1D20;font-size:20px">tolerable at steady state.</text>
<text class="mut" x="92" y="830" style="font-size:19px">e.g. GST reconciliation, dealer outstanding</text>
<text class="mut" x="92" y="855" style="font-size:19px">settlement: team works until midnight</text>
<text class="mut" x="92" y="880" style="font-size:19px">for three days every quarter</text>
<rect x="616" y="576" width="520" height="320" rx="6" fill="#ECEBE7"/>
<text class="lab gold" x="644" y="622">Follow the apology</text>
<text class="body" x="644" y="660" style="font-style:italic">“What do you apologise to dealers for?”</text>
<text class="mut" x="644" y="700" style="fill:#1C1D20;font-size:20px">The answer is the process failure that has</text>
<text class="mut" x="644" y="727" style="fill:#1C1D20;font-size:20px">become a relationship cost. In a dealer-driven</text>
<text class="mut" x="644" y="754" style="fill:#1C1D20;font-size:20px">business, relationship costs are existential:</text>
<text class="mut" x="644" y="781" style="fill:#1C1D20;font-size:20px">dealers switch for respect, not for price.</text>
<text class="mut" x="644" y="830" style="font-size:19px">e.g. Credit note processing takes 5 days,</text>
<text class="mut" x="644" y="855" style="font-size:19px">dealer calls three times to chase it:</text>
<text class="mut" x="644" y="880" style="font-size:19px">the apology is the diagnostic</text>

</g>
</svg>
