<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 722" width="1200" height="722" role="img" aria-label="The one decision this week: pick the wound, find the person, give access">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="722" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 16.3 — THE ONE DECISION THIS WEEK</text>
<text class="h" x="64" y="122">Not a programme. Three things, done in order.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<defs><marker id="fa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55565D"/></marker></defs>
<rect x="64" y="196" width="336" height="360" fill="#ECEBE7" fill-opacity="1" stroke="#8A8B92" stroke-width="2.5"/>
<text class="" x="92" y="280" style="font-size:56px;font-weight:700">01</text>
<text class="lab" x="92" y="334" style="font-size:25px">Pick one wound</text>
<text class="body" x="92" y="380" style="font-size:21px">Small. Bleeding cash</text>
<text class="body" x="92" y="410" style="font-size:21px">visibly.</text>
<text class="body" x="92" y="456" style="font-size:21px">Not the biggest. Not the</text>
<text class="body" x="92" y="486" style="font-size:21px">most strategic.</text>
<text class="body" x="92" y="532" style="font-size:21px">One site, twelve weeks.</text>
<line x1="406" y1="380" x2="426" y2="380" stroke="#55565D" stroke-width="3" marker-end="url(#fa)"/>
<rect x="432" y="196" width="336" height="360" fill="#ECEBE7" fill-opacity="1" stroke="#8A8B92" stroke-width="2.5"/>
<text class="" x="460" y="280" style="font-size:56px;font-weight:700">02</text>
<text class="lab" x="460" y="334" style="font-size:25px">Find that person</text>
<text class="body" x="460" y="380" style="font-size:21px">Whose hand goes up when</text>
<text class="body" x="460" y="410" style="font-size:21px">you ask whose Tuesday gets</text>
<text class="body" x="460" y="440" style="font-size:21px">better.</text>
<text class="body" x="460" y="486" style="font-size:21px">Not the executive sponsor.</text>
<text class="body" x="460" y="516" style="font-size:21px">The person doing the work.</text>
<line x1="774" y1="380" x2="794" y2="380" stroke="#55565D" stroke-width="3" marker-end="url(#fa)"/>
<rect x="800" y="196" width="336" height="360" fill="#B8952B" fill-opacity=".14" stroke="#B8952B" stroke-width="2.5"/>
<text class="gold" x="828" y="280" style="font-size:56px;font-weight:700">03</text>
<text class="lab" x="828" y="334" style="font-size:25px">Give real access</text>
<text class="body" x="828" y="380" style="font-size:21px">Personally clear the</text>
<text class="body" x="828" y="410" style="font-size:21px">badge, the credentials,</text>
<text class="body" x="828" y="440" style="font-size:21px">the introduction. This</text>
<text class="body" x="828" y="470" style="font-size:21px">week, not through the</text>
<text class="body" x="828" y="500" style="font-size:21px">process.</text>
<line x1="64" y1="596" x2="1136" y2="596" stroke="#D2D1CD"/>
<text class="lab" x="64" y="640">The organisations that look different in five years started with the smallest,</text>
<text class="lab" x="64" y="672">most boring, most bleeding wound they could find: this month.</text>

</g>
</svg>
