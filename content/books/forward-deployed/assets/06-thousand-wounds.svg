<text class="lab red end" x="1136" y="386" style="font-size:22px">Old threshold: ~$250k/yr</text>
<text class="mut end" x="1136" y="414">consulting engagement minimum</text>
<text class="lab gold" x="150" y="556" style="font-size:22px">New threshold: ~$50k/yr</text>
<text class="mut" x="150" y="584">one operator, six to twelve weeks</text>
<text class="lab mid" x="275" y="646" style="font-size:22px">~50 workflows</text>
<text class="mut mid" x="275" y="676">above the old line</text>
<text class="lab gold mid" x="646" y="646" style="font-size:22px">~1,000 workflows</text>
<text class="mut mid" x="646" y="676">between the lines</text>
<rect x="64" y="800" width="1072" height="130" fill="#B8952B" fill-opacity=".14"/>
<text class="cap gold" x="88" y="840">THE OPERATING MODEL</text>
<text class="body" x="88" y="874">The thousand wounds between the lines are the operating model. They are what the</text>
<text class="body" x="88" y="904">enterprise means when it says “transformation” and could never fund.</text>

