<text class="kicker" x="64" y="72">FIGURE 6.3 — THE LONG TAIL OF WOUNDS</text>
<text class="h" x="64" y="122">Below the old line, nobody came.</text>
<text class="h" x="64" y="164">Below the new line, everyone qualifies.</text>
