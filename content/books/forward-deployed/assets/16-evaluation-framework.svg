<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="How to evaluate whether a deployment is working">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="860" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 16.2 — WHAT TO WATCH, NOT WHAT TO TRACK</text>
<text class="h" x="64" y="122">Consulting metrics measure activity. These measure change.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="600" y1="186" x2="600" y2="690" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">STOP WATCHING</text><line x1="64" y1="226" x2="540" y2="226" stroke="#8A8B92" stroke-width="2"/>
<text class="cap gold" x="660" y="206">START WATCHING</text><line x1="660" y1="226" x2="1136" y2="226" stroke="#B8952B" stroke-width="3"/>
<text class="body" x="64" y="282" style="fill:#55565D">Status reports, RAG dashboards</text>
<text class="lab" x="660" y="282" style="font-size:22px">What actually changed since week four</text>
<text class="body" x="64" y="366" style="fill:#55565D">Hours logged, utilisation</text>
<text class="lab" x="660" y="366" style="font-size:22px">Completion rate: did the metric move</text>
<text class="body" x="64" y="450" style="fill:#55565D">“We are still finalising data access”</text>
<text class="lab" x="660" y="450" style="font-size:22px">What gets volunteered, unprompted, by</text>
<text class="lab" x="660" y="478" style="font-size:22px">week 8</text>
<text class="body" x="64" y="534" style="fill:#55565D">Whether anything has gone wrong yet</text>
<text class="lab" x="660" y="534" style="font-size:22px">How the first failure is handled, in</text>
<text class="lab" x="660" y="562" style="font-size:22px">person</text>
<text class="body" x="64" y="618" style="fill:#55565D">A clean, uneventful engagement</text>
<text class="lab" x="660" y="618" style="font-size:22px">Whether the edge case has been checked</text>
<line x1="64" y1="724" x2="1136" y2="724" stroke="#D2D1CD"/>
<text class="lab" x="64" y="768">A smooth engagement with nothing volunteered is a weaker signal than</text>
<text class="lab" x="64" y="800">a rocky one, handled well, with the team talking.</text>

</g>
</svg>
