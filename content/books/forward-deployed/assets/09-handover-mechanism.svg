<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 976" width="1200" height="976" role="img" aria-label="Deployment, handover, internal referral, next deployment">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="976" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 9.1 — THE HANDOVER AS SALES MECHANISM</text>
<text class="h" x="64" y="122">The handover is the sales mechanism</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8952B"/></marker></defs>
<line x1="326" y1="214" x2="326" y2="704" stroke="#B8952B" stroke-width="3" marker-end="url(#ah)"/>
<text class="cap" x="64" y="244" style="letter-spacing:1px">DEPLOYMENT</text>
<text class="mut" x="64" y="274">Week 2–12</text>
<circle cx="326" cy="256" r="11" fill="#B8952B"/>
<rect x="366" y="204" width="770" height="108" fill="#ECEBE7" stroke="#8A8B92" stroke-width="2.5"/>
<text class="lab" x="392" y="244" style="font-size:23px">Operator ships the fix</text>
<text class="mut" x="392" y="274">Workflow changes · Metric moves ·</text>
<text class="mut" x="392" y="301">Owner is trained alongside</text>
<text class="cap" x="64" y="372" style="letter-spacing:1px">HANDOVER</text>
<text class="mut" x="64" y="402">Week 12</text>
<circle cx="326" cy="384" r="11" fill="#B8952B"/>
<rect x="366" y="332" width="770" height="108" fill="#ECEBE7" stroke="#B8952B" stroke-width="2.5"/>
<text class="lab" x="392" y="372" style="font-size:23px">Three things are true</text>
<text class="mut" x="392" y="402">1. Workflow runs without operator</text>
<text class="mut" x="392" y="429">2. Owner can explain it · 3. Metric in Monday MIS</text>
<text class="cap" x="64" y="500" style="letter-spacing:1px">INTERNAL REFERRAL</text>
<text class="mut" x="64" y="530">Week 14–20</text>
<circle cx="326" cy="512" r="11" fill="#B8952B"/>
<rect x="366" y="460" width="770" height="108" fill="#ECEBE7" stroke="#8A8B92" stroke-width="2.5"/>
<text class="lab" x="392" y="500" style="font-size:23px">Owner tells a peer</text>
<text class="mut" x="392" y="530">Vizag branch manager tells Lucknow branch</text>
<text class="mut" x="392" y="557">manager at quarterly review</text>
<text class="cap" x="64" y="628" style="letter-spacing:1px">NEXT DEPLOYMENT</text>
<text class="mut" x="64" y="658">Week 20+</text>
<circle cx="326" cy="640" r="11" fill="#B8952B"/>
<rect x="366" y="588" width="770" height="108" fill="#ECEBE7" stroke="#B8952B" stroke-width="2.5"/>
<text class="lab" x="392" y="628" style="font-size:23px">Invitation</text>
<text class="mut" x="392" y="658">Not a pitch. A pull.</text>
<rect x="64" y="726" width="520" height="200" fill="#ECEBE7"/>
<text class="cap gold" x="88" y="766">WHY THE INTERNAL REFERRAL WORKS</text>
<text class="body" x="88" y="804" style="font-size:21px">The branch manager who says “it worked</text>
<text class="body" x="88" y="833" style="font-size:21px">for us” has no commercial interest in the</text>
<text class="body" x="88" y="862" style="font-size:21px">outcome. In an Indian group, that carries a</text>
<text class="body" x="88" y="891" style="font-size:21px">weight that no external proposal ever will.</text>
<rect x="616" y="726" width="520" height="200" fill="#ECEBE7"/>
<text class="cap red" x="640" y="766">WHAT DOES NOT WORK</text>
<text class="body" x="640" y="804" style="font-size:21px">Operator pitches directly to the next site.</text>
<text class="body" x="640" y="833" style="font-size:21px">Feels like a vendor expanding their footprint.</text>
<text class="body" x="640" y="862" style="font-size:21px">Triggers the antibodies. The director asks:</text>
<text class="lab red" x="640" y="896" style="font-size:21px;font-style:italic">“Why are you selling, and who is paying?”</text>

</g>
</svg>
