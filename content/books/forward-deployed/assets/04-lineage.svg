<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" width="1200" height="1030" role="img" aria-label="The lineage of forward deployment doctrine">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1030" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 4.3 — THE LINEAGE</text>
<text class="h" x="64" y="122">Seven discoveries of one principle</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="326" y1="200" x2="326" y2="722" stroke="#8A8B92" stroke-width="3"/>
<circle cx="326" cy="221" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="228" style="fill:#8A6D12">1806 → 1869</text>
<text class="lab" x="362" y="228" style="font-size:23px">Auftragstaktik</text>
<text class="mut end" x="1136" y="228">Prussia, after Jena</text>
<text class="body" x="362" y="262">“send intent, not method”</text>
<circle cx="326" cy="309" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="316" style="fill:#8A6D12">1940s → 1970s</text>
<text class="lab" x="362" y="316" style="font-size:23px">Forward-deployed naval forces</text>
<text class="mut end" x="1136" y="316">Seventh Fleet, Yokosuka</text>
<text class="body" x="362" y="350">“distance is time, and capability that arrives late is zero”</text>
<circle cx="326" cy="397" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="404" style="fill:#8A6D12">1976</text>
<text class="lab" x="362" y="404" style="font-size:23px">Boyd’s OODA loop</text>
<text class="mut end" x="1136" y="404">from air combat over Korea</text>
<text class="body" x="362" y="438">“cycle faster than the situation changes”</text>
<circle cx="326" cy="485" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="492" style="fill:#8A6D12">1999</text>
<text class="lab" x="362" y="492" style="font-size:23px">The strategic corporal</text>
<text class="mut end" x="1136" y="492">Krulak, Marine Corps</text>
<text class="body" x="362" y="526">“consequence has moved down; training and delegation must follow”</text>
<circle cx="326" cy="573" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="580" style="fill:#8A6D12">ongoing</text>
<text class="lab" x="362" y="580" style="font-size:23px">The 12-person detachment</text>
<text class="mut end" x="1136" y="580">US Special Forces ODA</text>
<text class="body" x="362" y="614">“multiply the local force; do not do its fighting”</text>
<circle cx="326" cy="661" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="668" style="fill:#8A6D12">2005 →</text>
<text class="lab" x="362" y="668" style="font-size:23px">The forward deployed engineer</text>
<text class="mut end" x="1136" y="668">Palantir</text>
<text class="body" x="362" y="702">“ship, don’t recommend, and feed the field back into the product”</text>
<circle cx="326" cy="749" r="9" fill="#B8952B"/>
<text class="cap" x="64" y="756" style="fill:#8A6D12">2023 →</text>
<text class="lab" x="362" y="756" style="font-size:23px">The AI multiplier</text>
<text class="mut end" x="1136" y="756">this book</text>
<text class="body" x="362" y="790">“the unit is now one person”</text>
<line x1="64" y1="836" x2="1136" y2="836" stroke="#D2D1CD"/>
<text class="lab" x="64" y="880">Put a small, highly capable unit at the point of contact. Give it the</text>
<text class="lab" x="64" y="912">intent and the authority, not the instructions.</text>
<text class="mut" x="64" y="952">Let it cycle faster than the situation changes. That is forward</text>
<text class="mut" x="64" y="980">deployment; everything else is implementation.</text>

</g>
</svg>
