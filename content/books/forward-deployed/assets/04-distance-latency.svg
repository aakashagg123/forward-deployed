<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="The rear decision loop versus the forward decision loop">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1000" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 4.1 — DISTANCE IS LATENCY</text>
<text class="h" x="64" y="122">Same problem. Same organisation. Two loops.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="620" y1="186" x2="620" y2="740" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">THE REAR LOOP</text>
<text class="mut" x="64" y="236">run from the centre</text>
<circle cx="330" cy="500" r="130" fill="none" stroke="#8A8B92" stroke-width="2.5"/>
<circle cx="330" cy="370" r="9" fill="#1C1D20"/>
<circle cx="443" cy="435" r="9" fill="#1C1D20"/>
<circle cx="443" cy="565" r="9" fill="#1C1D20"/>
<circle cx="330" cy="630" r="9" fill="#1C1D20"/>
<circle cx="217" cy="565" r="9" fill="#1C1D20"/>
<circle cx="217" cy="435" r="9" fill="#1C1D20"/>
<text class="cap mid" x="330" y="344">OBSERVE</text>
<text class="cap" x="462" y="442">ESCALATE</text>
<text class="mut" x="462" y="468">waits on</text>
<text class="mut" x="462" y="496">a meeting</text>
<text class="cap" x="462" y="572">REVIEW</text>
<text class="mut" x="462" y="598">waits on</text>
<text class="mut" x="462" y="626">a meeting</text>
<text class="cap mid" x="330" y="676">PRIORITISE</text>
<text class="mut mid" x="330" y="704">waits on a cycle</text>
<text class="cap end" x="198" y="572">RESOURCE</text>
<text class="cap end" x="198" y="442">BUILD</text>
<text class="red mid" x="330" y="516" style="font-size:60px;font-weight:700">12–18</text>
<text class="mut red mid" x="330" y="552">months per cycle</text>
<text class="cap" x="660" y="206">THE FORWARD LOOP</text>
<text class="mut" x="660" y="236">run at the work</text>
<circle cx="900" cy="500" r="110" fill="none" stroke="#B8952B" stroke-width="3"/>
<circle cx="900" cy="390" r="9" fill="#B8952B"/>
<circle cx="1010" cy="500" r="9" fill="#B8952B"/>
<circle cx="900" cy="610" r="9" fill="#B8952B"/>
<circle cx="790" cy="500" r="9" fill="#B8952B"/>
<text class="cap mid" x="900" y="364">OBSERVE</text>
<text class="cap" x="1032" y="508">BUILD</text>
<text class="cap end" x="768" y="508">REBUILD</text>
<text class="cap mid" x="900" y="656">WATCH SOMEONE USE IT</text>
<text class="gold mid" x="900" y="516" style="font-size:60px;font-weight:700">4</text>
<text class="mut gold mid" x="900" y="552">days per cycle</text>
<line x1="64" y1="770" x2="1136" y2="770" stroke="#D2D1CD"/>
<text class="lab" x="64" y="814">By the time the rear loop finishes its second meeting,</text>
<text class="lab" x="64" y="846">the forward loop has cycled twelve times.</text>
<text class="mut" x="64" y="886">The advantage is not speed. It is that fast loops generate information:</text>
<text class="mut" x="64" y="914">the exception case, the blank field, the real workaround.</text>
<text class="mut" x="64" y="942">Slow loops cannot buy it at any price.</text>

</g>
</svg>
