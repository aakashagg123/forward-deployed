<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1210" width="1200" height="1210" role="img" aria-label="Adjacent, analogous and new rings of deployment">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1210" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 9.2 — THE COMPOUNDING SEQUENCE</text>
<text class="h" x="64" y="122">The compounding sequence</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="mut" x="64" y="196">Adjacent → Analogous → New. Each ring is cheaper because of the return path.</text>
<circle cx="334" cy="604" r="280" fill="none" stroke="#B8952B" stroke-width="3" stroke-opacity="0.35"/>
<circle cx="334" cy="604" r="210" fill="none" stroke="#B8952B" stroke-width="3" stroke-opacity="0.55"/>
<circle cx="334" cy="604" r="140" fill="none" stroke="#B8952B" stroke-width="3" stroke-opacity="0.9"/>
<circle cx="334" cy="604" r="68" fill="#B8952B" fill-opacity=".2" stroke="#B8952B" stroke-width="3"/>
<text class="lab gold mid" x="334" y="600" style="font-size:20px">First</text><text class="lab gold mid" x="334" y="626" style="font-size:20px">deployment</text>
<text class="cap gold mid" x="334" y="506">ADJACENT</text>
<text class="cap gold mid" x="334" y="435">ANALOGOUS</text>
<text class="cap gold mid" x="334" y="365">NEW</text>
<rect x="640" y="230" width="496" height="262" fill="#ECEBE7"/>
<text class="cap gold" x="664" y="268">RING 1 · ADJACENT</text>
<text class="lab" x="664" y="302" style="font-size:22px">Same workflow, different site</text>
<text class="mut" x="664" y="334">Credit check fixed in Mumbai, deployed in</text>
<text class="mut" x="664" y="360">Lucknow, Indore, Raipur. 90% transfers.</text>
<text class="mut" x="664" y="386">10% local variation found in week 1.</text>
<text x="664" y="468" style="font-size:38px;font-weight:700;fill:#8A6D12">6 wks</text>
<text class="mut" x="776" y="456">vs 12 for the first:</text>
<text class="mut" x="776" y="480">builds the margin</text>
<rect x="640" y="512" width="496" height="262" fill="#ECEBE7"/>
<text class="cap gold" x="664" y="550">RING 2 · ANALOGOUS</text>
<text class="lab" x="664" y="584" style="font-size:22px">Different workflow, similar</text>
<text class="lab" x="664" y="612" style="font-size:22px">structure, same company</text>
<text class="mut" x="664" y="644">Credit check → dealer reconciliation →</text>
<text class="mut" x="664" y="670">inventory replenishment. Tooling partially</text>
<text class="mut" x="664" y="696">transfers. Political map fully transfers.</text>
<text x="664" y="750" style="font-size:38px;font-weight:700;fill:#8A6D12">8 wks</text>
<text class="mut" x="776" y="738">builds the breadth</text>
<rect x="640" y="794" width="496" height="262" fill="#ECEBE7"/>
<text class="cap gold" x="664" y="832">RING 3 · NEW</text>
<text class="lab" x="664" y="866" style="font-size:22px">Different workflow, different</text>
<text class="lab" x="664" y="894" style="font-size:22px">company, different industry</text>
<text class="mut" x="664" y="926">Scaffolding transfers. Domain knowledge</text>
<text class="mut" x="664" y="952">does not. Full cold-start cost. New</text>
<text class="mut" x="664" y="978">political map.</text>
<text x="664" y="1032" style="font-size:38px;font-weight:700;fill:#8A6D12">12 wks</text>
<text class="mut" x="794" y="1020">builds the scale: pursue only</text>
<text class="mut" x="794" y="1044">after rings 1–2 pay</text>
<line x1="64" y1="1090" x2="1136" y2="1090" stroke="#D2D1CD"/>
<text class="lab" x="64" y="1134">The firm that skips to Ring 3 before exhausting Ring 1 pays cold-start</text>
<text class="lab" x="64" y="1166">cost on every deployment and never compounds.</text>

</g>
</svg>
