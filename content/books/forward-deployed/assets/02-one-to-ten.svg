<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="The ten to one rule of organisational capital">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#1C1D20}
.note{font-size:13px;fill:#7A7B82}
.item{font-size:14.5px;fill:#4A4B50}
</style>
<rect width="1200" height="680" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 2.2 — THE TEN-TO-ONE RULE</text>
<text class="t h" x="64" y="112">For every $1 of technology, ~$10 of organisational capital</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<text class="t col" x="64" y="196">VISIBLE · HAS AN INVOICE</text>
<rect x="64" y="220" width="236" height="150" fill="#1C1D20"/>
<text class="t" x="182" y="300" text-anchor="middle" font-size="52" fill="#F7F6F3">$1</text>
<text class="t" x="182" y="330" text-anchor="middle" font-size="12" letter-spacing="2" fill="#F7F6F3">TECHNOLOGY</text>
<text class="t note" x="64" y="404">licences · infrastructure · vendor fees · integration partner</text>
<text class="t note" x="64" y="428">has a budget line, an owner, a procurement process</text>
<text class="t note" x="64" y="452">and someone to blame if it fails</text>

<text class="t" x="64" y="530" font-size="17" fill="#C8553D">Enterprises buy the one</text>
<text class="t" x="64" y="558" font-size="17" fill="#C8553D">and skip the ten —</text>
<text class="t" x="64" y="586" font-size="17" fill="#C8553D">then hold a review to</text>
<text class="t" x="64" y="614" font-size="17" fill="#C8553D">ask why adoption is low.</text>

<line x1="368" y1="176" x2="368" y2="640" stroke="#E4E3DF"/>

<text class="t col" x="424" y="196">INVISIBLE · NO BUDGET LINE, NO VENDOR</text>
<text class="t" x="1136" y="196" text-anchor="end" font-size="34" fill="#B8952B">$10</text>

<g>
<rect x="424" y="220" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="444" y="248">Process redesign</text>
<rect x="424" y="276" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="444" y="304">Retraining</text>
<rect x="424" y="332" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="444" y="360">New job definitions</text>
<rect x="424" y="388" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="444" y="416">Changed reporting lines</text>
<rect x="424" y="444" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="444" y="472">Rewritten incentives</text>
<rect x="806" y="220" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="826" y="248">Data cleaned and reconciled</text>
<rect x="806" y="276" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="826" y="304">Exception paths defined</text>
<rect x="806" y="332" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="826" y="360">Decision rights moved</text>
<rect x="806" y="388" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="826" y="416">The old path closed</text>
<rect x="806" y="444" width="330" height="44" fill="none" stroke="#C5C4C0"/><text class="t item" x="826" y="472">Support ownership assigned</text>
</g>
<text class="t note" x="424" y="530">None of this is fungible. The retraining credit ops needs is not the retraining sales ops needs.</text>
<text class="t note" x="424" y="554">It is specific to each workflow, and only visible from close range —</text>
<text class="t note" x="424" y="578">which is exactly why it cannot be built in a programme office and distributed.</text>
</svg>
