<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="The ten to one rule of organisational capital">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="820" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 2.2 — THE TEN-TO-ONE RULE</text>
<text class="h" x="64" y="122">For every $1 of technology, about $10 of organisational capital</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206">VISIBLE · HAS AN INVOICE</text>
<rect x="64" y="232" width="300" height="140" fill="#1C1D20"/>
<text class="mid inv" x="214" y="312" style="font-size:64px;font-weight:700">$1</text>
<text class="cap inv mid" x="214" y="350">TECHNOLOGY</text>
<text class="mut" x="64" y="412">Licences, infrastructure,</text>
<text class="mut" x="64" y="440">vendor fees, integration</text>
<text class="mut" x="64" y="468">partner.</text>
<text class="mut" x="64" y="520">Has a budget line, an owner,</text>
<text class="mut" x="64" y="548">a procurement process and</text>
<text class="mut" x="64" y="576">someone to blame if it fails.</text>
<text class="lab red" x="64" y="640">Enterprises buy the one</text>
<text class="lab red" x="64" y="672">and skip the ten, then hold</text>
<text class="lab red" x="64" y="704">a review to ask why</text>
<text class="lab red" x="64" y="736">adoption is low.</text>
<line x1="392" y1="186" x2="392" y2="790" stroke="#D2D1CD"/>
<text class="cap" x="440" y="206">INVISIBLE · NO BUDGET LINE, NO VENDOR</text>
<text class="gold end" x="1136" y="210" style="font-size:44px;font-weight:700">$10</text>
<rect x="440" y="236" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="458" y="271">Process redesign</text>
<rect x="800" y="236" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="818" y="271">Data cleaned and reconciled</text>
<rect x="440" y="302" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="458" y="337">Retraining</text>
<rect x="800" y="302" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="818" y="337">Exception paths defined</text>
<rect x="440" y="368" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="458" y="403">New job definitions</text>
<rect x="800" y="368" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="818" y="403">Decision rights moved</text>
<rect x="440" y="434" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="458" y="469">Changed reporting lines</text>
<rect x="800" y="434" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="818" y="469">The old path closed</text>
<rect x="440" y="500" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="458" y="535">Rewritten incentives</text>
<rect x="800" y="500" width="336" height="54" fill="none" stroke="#8A8B92" stroke-width="1.5"/><text class="body" x="818" y="535">Support ownership assigned</text>
<text class="mut" x="440" y="610">None of this is fungible. The retraining credit ops needs</text>
<text class="mut" x="440" y="640">is not the retraining sales ops needs. It is specific to each</text>
<text class="mut" x="440" y="670">workflow, and only visible from close range. That is why it</text>
<text class="mut" x="440" y="700">cannot be built in a programme office and distributed.</text>

</g>
</svg>
