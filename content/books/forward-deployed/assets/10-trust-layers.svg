<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="The three layers of trust in a deployment">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="960" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 10.1 — THE THREE LAYERS OF TRUST</text>
<text class="h" x="64" y="122">Competence first. Intention second. Structure last.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<rect x="64" y="190" width="1072" height="404" fill="#ECEBE7" stroke="#8A8B92" stroke-width="2"/>
<text class="cap" x="96" y="232">LAYER 3 · STRUCTURAL TRUST</text>
<text class="body" x="96" y="264" style="font-style:italic">“This survives failure.”</text>
<text class="mut end" x="1104" y="232">Earned by surviving</text>
<text class="mut end" x="1104" y="260">the first thing that goes wrong</text>
<rect x="120" y="292" width="960" height="262" fill="#E0DFDA" stroke="#8A8B92" stroke-width="2"/>
<text class="cap" x="152" y="334">LAYER 2 · INTENTION TRUST</text>
<text class="body" x="152" y="366" style="font-style:italic">“They are here for the right reasons.”</text>
<text class="mut end" x="1048" y="334">Earned by protecting</text>
<text class="mut end" x="1048" y="362">information shared in confidence</text>
<rect x="176" y="394" width="848" height="122" fill="#1C1D20"/>
<text class="cap inv" x="208" y="438">LAYER 1 · COMPETENCE TRUST</text>
<text class="body inv" x="208" y="470" style="font-style:italic">“They can actually do the thing.”</text>
<text class="mut end" x="992" y="438" style="fill:#D2D1CD">Earned by shipping</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55565D"/></marker></defs>
<line x1="150" y1="650" x2="1050" y2="650" stroke="#55565D" stroke-width="3" marker-end="url(#arr)"/>
<text class="cap" x="150" y="692">WEEK 1</text><text class="cap mid" x="460" y="692">MONTH 2</text><text class="cap mid" x="740" y="692">MONTH 4</text><text class="cap end" x="1050" y="692">MONTH 6+</text>
<line x1="150" y1="716" x2="430" y2="716" stroke="#B8952B" stroke-width="3"/>
<text class="lab gold mid" x="290" y="750" style="font-size:21px">Ship something</text>
<text class="lab gold mid" x="290" y="776" style="font-size:21px">small</text>
<line x1="470" y1="716" x2="730" y2="716" stroke="#B8952B" stroke-width="3"/>
<text class="lab gold mid" x="600" y="750" style="font-size:21px">Protect someone’s</text>
<text class="lab gold mid" x="600" y="776" style="font-size:21px">truth</text>
<line x1="770" y1="716" x2="1050" y2="716" stroke="#B8952B" stroke-width="3"/>
<text class="lab gold mid" x="910" y="750" style="font-size:21px">Survive the first</text>
<text class="lab gold mid" x="910" y="776" style="font-size:21px">failure together</text>
<line x1="64" y1="830" x2="1136" y2="830" stroke="#D2D1CD"/>
<text class="lab" x="64" y="874">Skip a layer and the ones above it do not hold. Most operators try to</text>
<text class="lab" x="64" y="906">build intention trust before earning competence trust.</text>

</g>
</svg>
