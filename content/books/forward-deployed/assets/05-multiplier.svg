<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1330" width="1200" height="1330" role="img" aria-label="What AI collapsed and what it did not">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1330" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 5.2 — THE MULTIPLIER</text>
<text class="h" x="64" y="122">The build cost collapsed. The trust cost did not.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="600" y1="186" x2="600" y2="828" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">2015 · THE UNIT THAT COULD</text>
<text class="cap" x="64" y="232">CHANGE A WORKFLOW</text>
<rect x="64" y="262" width="496" height="60" fill="#1C1D20"/><text class="body inv" x="86" y="301">Business analyst</text>
<rect x="64" y="338" width="496" height="60" fill="#1C1D20"/><text class="body inv" x="86" y="377">Application engineer</text>
<rect x="64" y="414" width="496" height="60" fill="#1C1D20"/><text class="body inv" x="86" y="453">Data engineer</text>
<rect x="64" y="490" width="496" height="60" fill="#1C1D20"/><text class="body inv" x="86" y="529">Test / QA</text>
<rect x="64" y="566" width="496" height="60" fill="#1C1D20"/><text class="body inv" x="86" y="605">Integration engineer</text>
<rect x="64" y="642" width="496" height="60" fill="#1C1D20"/><text class="body inv" x="86" y="681">Project manager</text>
<text class="cap" x="640" y="206">2026 · THE UNIT</text>
<rect x="640" y="262" width="496" height="60" fill="#B8952B"/><text class="body" x="662" y="301" style="font-weight:700">The operator</text>
<rect x="640" y="338" width="496" height="470" fill="none" stroke="#B8952B" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap gold" x="662" y="376">THE MACHINE</text>
<text class="mut" x="662" y="416">writes the code: once the largest line</text>
<text class="mut" x="662" y="442">item, now the smallest</text>
<text class="mut" x="662" y="482">reads a decade of schema weirdness</text>
<text class="mut" x="662" y="508">in an afternoon</text>
<text class="mut" x="662" y="548">produces the integration scaffolding,</text>
<text class="mut" x="662" y="574">migrations, retries, tests</text>
<text class="mut" x="662" y="614">generates a first version fast enough</text>
<text class="mut" x="662" y="640">to throw away</text>
<text class="mut" x="662" y="680">writes the handover material operators</text>
<text class="mut" x="662" y="706">always skipped, which is exactly what</text>
<text class="mut" x="662" y="732">determines whether the thing survives them</text>
<text class="mut" x="662" y="772">and the reliable task length keeps</text>
<text class="mut" x="662" y="798">doubling on a scale of months</text>
<text class="gold" x="64" y="888" style="font-size:56px;font-weight:700;fill:#1C1D20">6–9 months</text>
<text class="gold" x="640" y="888" style="font-size:56px;font-weight:700">6–12 weeks</text>
<text class="mut" x="64" y="928">Needs a business case large enough to</text>
<text class="mut" x="64" y="956">justify six salaries, so only large</text>
<text class="mut red" x="64" y="984">problems qualify, and the thousand small</text>
<text class="mut red" x="64" y="1012">bleeding workflows that make up the</text>
<text class="mut red" x="64" y="1040">operating model never do.</text>
<text class="mut gold" x="640" y="928">Small enough that the thousand workflows</text>
<text class="mut gold" x="640" y="956">now qualify, which is the entire reason</text>
<text class="mut gold" x="640" y="984">this model is newly viable.</text>
<rect x="64" y="1094" width="1072" height="170" fill="#B0432D" fill-opacity=".10"/>
<text class="cap red" x="88" y="1134">WHAT DID NOT COLLAPSE</text>
<text class="body" x="88" y="1170">Knowing which workflow is bleeding · the relationship that makes someone tell you the truth</text>
<text class="body" x="88" y="1202">about their own workaround · the authority to close the old path · someone who can be held</text>
<text class="body" x="88" y="1234">accountable. These were always the hard parts. They still are.</text>

</g>
</svg>
