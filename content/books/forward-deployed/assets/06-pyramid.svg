<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1172" width="1200" height="1172" role="img" aria-label="The consulting pyramid problem">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1172" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 6.2 — THE PYRAMID PROBLEM</text>
<text class="h" x="64" y="122">The base is the revenue.</text>
<text class="h" x="64" y="164">The base is what the machine absorbed.</text>
<line x1="64" y1="194" x2="1136" y2="194" stroke="#D2D1CD"/>
<g transform="translate(0,42)">
<line x1="600" y1="186" x2="600" y2="860" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">THE CONSULTING PYRAMID</text>
<rect x="212" y="236" width="220" height="100" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2.5"/><text class="cap mid" x="322" y="276">PARTNERS</text><text class="mut mid" x="322" y="308">sell the work</text>
<rect x="132" y="346" width="380" height="104" fill="#F7F6F3" stroke="#1C1D20" stroke-width="2.5"/><text class="cap mid" x="322" y="388">MANAGERS</text><text class="mut mid" x="322" y="420">scope &amp; oversee</text>
<rect x="64" y="460" width="516" height="164" fill="#B0432D" fill-opacity=".12" stroke="#B0432D" stroke-width="2.5"/><text class="cap red mid" x="322" y="502">JUNIOR CONSULTANTS</text><text class="mut red mid" x="322" y="536">execute: analysis, data, slides</text><text class="lab red mid" x="322" y="582" style="font-size:21px">this is the revenue base</text>
<text class="lab" x="64" y="676" style="font-size:22px">Revenue = people × rate</text>
<text class="mut red" x="64" y="722">↑ The machine absorbs this layer’s work.</text>
<text class="mut" x="64" y="750">Pyramid gets shorter. Shorter = less revenue.</text>
<text class="cap" x="640" y="206">WHY THEY CANNOT FOLLOW</text>
<rect x="640" y="236" width="496" height="138" fill="none" stroke="#8A8B92" stroke-width="2"/><text class="cap red" x="662" y="274">BASE COLLAPSES</text>
<text class="mut" x="662" y="306">Junior work is exactly what AI absorbs</text>
<text class="mut" x="662" y="332">first. Each productivity gain makes the</text>
<text class="mut" x="662" y="358">pyramid shorter.</text>
<rect x="640" y="386" width="496" height="138" fill="none" stroke="#8A8B92" stroke-width="2"/><text class="cap red" x="662" y="424">ENGAGEMENT MINIMUM</text>
<text class="mut" x="662" y="456">Floor is ~$500k. The thousand wounds are</text>
<text class="mut" x="662" y="482">$40–80k each. Cannot sell them, staff</text>
<text class="mut" x="662" y="508">them, or bill them.</text>
<rect x="640" y="536" width="496" height="138" fill="none" stroke="#8A8B92" stroke-width="2"/><text class="cap red" x="662" y="574">LEARNING IS LINEAR</text>
<text class="mut" x="662" y="606">Knowledge walks out with the team. Next</text>
<text class="mut" x="662" y="632">engagement starts cold. No compounding.</text>
<text class="mut" x="662" y="658">No return path.</text>
<rect x="640" y="686" width="496" height="138" fill="none" stroke="#8A8B92" stroke-width="2"/><text class="cap red" x="662" y="724">INCENTIVE INVERTED</text>
<text class="mut" x="662" y="756">Paid for people deployed, not workflows</text>
<text class="mut" x="662" y="782">changed. Efficiency reduces revenue.</text>
<text class="mut" x="662" y="808">Activity increases it.</text>
<rect x="64" y="870" width="1072" height="124" fill="#B8952B" fill-opacity=".14"/>
<text class="cap gold" x="88" y="906">THE FORWARD-DEPLOYED UNIT</text>
<text class="body" x="88" y="940">No pyramid. One operator. Revenue scales with deployments, not headcount. Margin comes</text>
<text class="body" x="88" y="970">from the gap between cost and value, not from billing hours.</text>

</g>
<line x1="64" y1="1068" x2="1136" y2="1068" stroke="#D2D1CD"/>
<text class="note" x="64" y="1108">This is not a criticism of consulting. It is a description of a business model built for</text>
<text class="note" x="64" y="1136">a world where the team was the irreducible unit. That world ended.</text>
</svg>
