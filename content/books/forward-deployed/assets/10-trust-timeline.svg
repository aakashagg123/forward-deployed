<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img" aria-label="Trust accrues in steps, not gradients">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1010" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 10.2 — THE TRUST STEP FUNCTION</text>
<text class="h" x="64" y="122">Trust accrues at events, not over time.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="230" y1="200" x2="230" y2="580" stroke="#8A8B92" stroke-width="2"/><line x1="230" y1="580" x2="1136" y2="580" stroke="#8A8B92" stroke-width="2"/>
<text class="cap end" x="212" y="556">ZERO</text>
<text class="cap end" x="212" y="446">COMPETENCE</text>
<line x1="230" y1="440" x2="1136" y2="440" stroke="#D2D1CD" stroke-width="1.5"/>
<text class="cap end" x="212" y="336">INTENTION</text>
<line x1="230" y1="330" x2="1136" y2="330" stroke="#D2D1CD" stroke-width="1.5"/>
<text class="cap end" x="212" y="226">STRUCTURAL</text>
<line x1="230" y1="220" x2="1136" y2="220" stroke="#D2D1CD" stroke-width="1.5"/>
<path d="M250 550 L480 550 L480 440 L700 440 L700 330 L900 330 L900 220 L1120 220" fill="none" stroke="#B8952B" stroke-width="5" stroke-linejoin="round"/>
<path d="M590 440 C 600 500 650 500 670 440" fill="none" stroke="#B0432D" stroke-width="3" stroke-dasharray="6 6"/>
<text class="mut red" x="570" y="534" style="fill:#B0432D">Failure event</text>
<text class="mut" x="250" y="500">Observation</text>
<text class="mut" x="250" y="526">“yeh bhi chal jaayega”</text>
<circle cx="480" cy="495" r="17" fill="#B8952B"/><text class="lab mid" x="480" y="502" style="font-size:20px">1</text>
<circle cx="700" cy="385" r="17" fill="#B8952B"/><text class="lab mid" x="700" y="392" style="font-size:20px">2</text>
<circle cx="900" cy="275" r="17" fill="#B8952B"/><text class="lab mid" x="900" y="282" style="font-size:20px">3</text>
<text class="mut mid" x="250" y="612">WEEK 1</text>
<text class="mut mid" x="480" y="612">WEEK 6</text>
<text class="mut mid" x="700" y="612">MONTH 3</text>
<text class="mut mid" x="900" y="612">MONTH 4</text>
<text class="mut mid" x="1090" y="612">MONTH 6</text>
<circle cx="81" cy="684" r="17" fill="#B8952B"/><text class="lab mid" x="81" y="691" style="font-size:20px">1</text>
<text class="lab" x="110" y="682" style="font-size:22px">First delivery ships</text>
<text class="mut" x="110" y="712">Competence trust earned</text>
<circle cx="445" cy="684" r="17" fill="#B8952B"/><text class="lab mid" x="445" y="691" style="font-size:20px">2</text>
<text class="lab" x="474" y="682" style="font-size:22px">First failure survived</text>
<text class="mut" x="474" y="712">Intention trust earned</text>
<circle cx="809" cy="684" r="17" fill="#B8952B"/><text class="lab mid" x="809" y="691" style="font-size:20px">3</text>
<text class="lab" x="838" y="682" style="font-size:22px">Team volunteers hidden</text>
<text class="lab" x="838" y="710" style="font-size:22px">problems</text>
<text class="mut" x="838" y="740">Structural trust earned</text>
<line x1="64" y1="790" x2="1136" y2="790" stroke="#D2D1CD"/>
<text class="lab" x="64" y="834">The flat periods are where the operator is being watched without being told.</text>
<text class="lab" x="64" y="866">The steps happen at events, not at milestones.</text>
<text class="mut" x="64" y="906">How the operator handles the failure determines whether the next step happens</text>
<text class="mut" x="64" y="934">or the function resets to zero.</text>

</g>
</svg>
