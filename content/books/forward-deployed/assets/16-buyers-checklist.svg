<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 828" width="1200" height="828" role="img" aria-label="Four demands for the enterprise buyer, traced to their source chapters">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="828" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 16.1 — THE BUYER’S CHECKLIST</text>
<text class="h" x="64" y="122">Four demands. Missing any one, it isn’t this model.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<rect x="64" y="190" width="1072" height="136" fill="#ECEBE7" stroke="#D2D1CD"/>
<circle cx="110" cy="258" r="24" fill="#1C1D20"/><text class="lab inv mid" x="110" y="266">1</text>
<text class="lab" x="164" y="236" style="font-size:23px">The deployment card, filled in, before anything starts</text>
<text class="mut" x="164" y="270">A real person’s name, a real number, a real site, or the wound hasn’t been found yet</text>
<text class="cap" x="164" y="304" style="fill:#8A6D12">CHAPTER 8 · PICK THE WOUND, NOT THE VISION</text>
<rect x="64" y="342" width="1072" height="136" fill="#F7F6F3" stroke="#D2D1CD"/>
<circle cx="110" cy="410" r="24" fill="#1C1D20"/><text class="lab inv mid" x="110" y="418">2</text>
<text class="lab" x="164" y="388" style="font-size:23px">Presence, and real access, not a sanitised extract</text>
<text class="mut" x="164" y="422">Clear the badge, the credentials, the introduction to who actually runs the process</text>
<text class="cap" x="164" y="456" style="fill:#8A6D12">CHAPTER 5 &amp; 10 · THE OPERATOR &amp; UNDERWRITING TRUST</text>
<rect x="64" y="494" width="1072" height="136" fill="#ECEBE7" stroke="#D2D1CD"/>
<circle cx="110" cy="562" r="24" fill="#1C1D20"/><text class="lab inv mid" x="110" y="570">3</text>
<text class="lab" x="164" y="540" style="font-size:23px">Your own antibodies, named and disclosed on day one</text>
<text class="mut" x="164" y="574">Tell them which functions sign off, what they care about, who the human is</text>
<text class="cap" x="164" y="608" style="fill:#8A6D12">CHAPTER 12 · THE ANTIBODIES</text>
<rect x="64" y="646" width="1072" height="136" fill="#F7F6F3" stroke="#D2D1CD"/>
<circle cx="110" cy="714" r="24" fill="#1C1D20"/><text class="lab inv mid" x="110" y="722">4</text>
<text class="lab" x="164" y="692" style="font-size:23px">Outcome-based pricing: be suspicious of anyone who won’t</text>
<text class="mut" x="164" y="726">A base-plus-value-share structure aligns their incentive with your outcome</text>
<text class="cap" x="164" y="760" style="fill:#8A6D12">CHAPTER 13 · THE NEW CONSULTING IS NOT CONSULTING</text>

</g>
</svg>
