<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="The pod as the institutional unit, and how pods compose into a firm">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#6A6B72}
.note{font-size:13px;fill:#7A7B82}
.lbl{font-size:14px;fill:#1C1D20}
</style>
<rect width="1200" height="660" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 14.3 — THE POD, NOT THE PLATFORM</text>
<text class="t h" x="64" y="112">One operator, one AI stack, one relationship at a time.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<!-- Single pod detail, left -->
<text class="t col" x="64" y="196">ONE POD</text>
<rect x="64" y="212" width="340" height="200" rx="10" fill="#EBEAE6" stroke="#D2D1CD"/>
<circle cx="160" cy="280" r="30" fill="#1C1D20"/>
<text class="t" x="160" y="286" text-anchor="middle" font-size="12" fill="#F7F6F3">OPERATOR</text>
<rect x="220" y="256" width="150" height="48" rx="6" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
<text class="t" x="295" y="284" text-anchor="middle" font-size="12" fill="#B8952B">AI STACK</text>
<text class="t note" x="84" y="352">One relationship, one pace</text>
<text class="t note" x="84" y="372">of trust-building</text>
<text class="t note" x="84" y="392">1–2 deployments per year</text>

<!-- Arrow to firm -->
<defs><marker id="parr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6A6B72"/></marker></defs>
<line x1="420" y1="312" x2="470" y2="312" stroke="#6A6B72" stroke-width="1.5" marker-end="url(#parr)"/>
<text class="t note" x="445" y="298" text-anchor="middle">scales by</text>
<text class="t note" x="445" y="332" text-anchor="middle">adding</text>

<!-- Firm as portfolio of pods, right -->
<text class="t col" x="520" y="196">THE FIRM · A PORTFOLIO OF PODS</text>
<rect x="520" y="212" width="616" height="200" rx="10" fill="#F7F6F3" stroke="#D2D1CD"/>

<g>
<circle cx="570" cy="260" r="16" fill="#1C1D20"/>
<rect x="596" y="250" width="60" height="20" rx="4" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
</g>
<g>
<circle cx="700" cy="260" r="16" fill="#1C1D20"/>
<rect x="726" y="250" width="60" height="20" rx="4" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
</g>
<g>
<circle cx="830" cy="260" r="16" fill="#1C1D20"/>
<rect x="856" y="250" width="60" height="20" rx="4" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
</g>
<g>
<circle cx="960" cy="260" r="16" fill="#1C1D20"/>
<rect x="986" y="250" width="60" height="20" rx="4" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
</g>

<g opacity="0.5">
<circle cx="570" cy="320" r="16" fill="#1C1D20"/>
<rect x="596" y="310" width="60" height="20" rx="4" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
</g>
<g opacity="0.5">
<circle cx="700" cy="320" r="16" fill="#1C1D20"/>
<rect x="726" y="310" width="60" height="20" rx="4" fill="#B8952B" opacity="0.15" stroke="#B8952B"/>
</g>

<text class="t note" x="540" y="380">Each pod is independent. No pod speeds up another pod's trust-building.</text>
<text class="t note" x="540" y="398">Bounded by Chapter 11's operator pipeline, not by capital or demand.</text>

<line x1="64" y1="460" x2="1136" y2="460" stroke="#D2D1CD"/>
<text class="t" x="64" y="492" font-size="16" fill="#4A4B50">Not a think-tank. Not a project team. A firm scales by adding pods, sized precisely to the part of the work that does not compress.</text>
</svg>
