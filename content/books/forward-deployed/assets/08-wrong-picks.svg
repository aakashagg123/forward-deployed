<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" width="1200" height="1090" role="img" aria-label="Three wrong picks and the right pick">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1090" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 8.2 — THE THREE WRONG PICKS</text>
<text class="h" x="64" y="122">The three wrong picks</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<rect x="64" y="190" width="344" height="530" fill="none" stroke="#B0432D" stroke-width="2.5"/>
<text class="lab" x="86" y="232" style="font-size:23px">The CEO’s priority</text>
<text class="cap red" x="86" y="262">FATAL: SCOPE</text>
<text class="body" x="86" y="304" style="font-size:20px;font-weight:700">Looks like: “Enterprise-wide</text>
<text class="body" x="86" y="331" style="font-size:20px;font-weight:700">supply chain visibility”</text>
<text class="mut" x="86" y="410">Requires 6 departments</text>
<text class="mut" x="86" y="437">Acquires a steering committee</text>
<text class="mut" x="86" y="464">Becomes an 18-month</text>
<text class="mut" x="86" y="491">programme</text>
<text class="mut" x="86" y="518">Operator spends time</text>
<text class="mut" x="86" y="545">in reviews</text>
<text class="mut" x="86" y="572">Dies of correct process</text>
<text class="lab red" x="86" y="650" style="font-size:20px">PRODUCES: a programme,</text>
<text class="lab red" x="86" y="678" style="font-size:20px">not a sentence</text>
<rect x="428" y="190" width="344" height="530" fill="none" stroke="#B0432D" stroke-width="2.5"/>
<text class="lab" x="450" y="232" style="font-size:23px">The interesting problem</text>
<text class="cap red" x="450" y="262">FATAL: TIME</text>
<text class="body" x="450" y="304" style="font-size:20px;font-weight:700">Looks like: “Logistics routing</text>
<text class="body" x="450" y="331" style="font-size:20px;font-weight:700">optimisation across 12 depots”</text>
<text class="mut" x="450" y="410">Technically fascinating</text>
<text class="mut" x="450" y="437">Requires data from 3 systems</text>
<text class="mut" x="450" y="464">Takes 6 months minimum</text>
<text class="mut" x="450" y="491">Owner won’t act on the output</text>
<text class="mut" x="450" y="518">Operator enjoys the work</text>
<text class="lab red" x="450" y="650" style="font-size:20px">PRODUCES: a model,</text>
<text class="lab red" x="450" y="678" style="font-size:20px">not a change</text>
<rect x="792" y="190" width="344" height="530" fill="none" stroke="#B0432D" stroke-width="2.5"/>
<text class="lab" x="814" y="232" style="font-size:23px">The visible problem</text>
<text class="cap red" x="814" y="262">FATAL: POLITICS</text>
<text class="body" x="814" y="304" style="font-size:20px;font-weight:700">Looks like: “Fix the</text>
<text class="body" x="814" y="331" style="font-size:20px;font-weight:700">dealer complaints everyone</text>
<text class="body" x="814" y="358" style="font-size:20px;font-weight:700">talks about”</text>
<text class="mut" x="814" y="410">Politically charged</text>
<text class="mut" x="814" y="437">Has constituencies</text>
<text class="mut" x="814" y="464">protecting it</text>
<text class="mut" x="814" y="491">Fixing it changes</text>
<text class="mut" x="814" y="518">someone’s status</text>
<text class="mut" x="814" y="545">Antibodies arrive in force</text>
<text class="mut" x="814" y="572">Surprise is impossible</text>
<text class="lab red" x="814" y="650" style="font-size:20px">PRODUCES: a fight,</text>
<text class="lab red" x="814" y="678" style="font-size:20px">not evidence</text>
<rect x="64" y="760" width="1072" height="270" fill="#B8952B" fill-opacity=".12" stroke="#B8952B" stroke-width="2.5"/>
<text class="lab gold" x="90" y="804" style="font-size:24px">The right pick: the invisible, boring, bleeding wound</text>
<text class="body" x="90" y="848">The credit team re-keys four documents per file, sixty files a week, thirty percent come</text>
<text class="body" x="90" y="878">back with errors. Nobody is protecting it. Nobody’s status depends on it. The owner</text>
<text class="body" x="90" y="908">wants it fixed because their work is painful.</text>
<text class="mut" x="90" y="956">Fixed with a parser, a validation rule, and a changed approval, in six weeks.</text>
<text class="lab gold" x="90" y="1004" style="font-size:22px">PRODUCES: the sentence that opens the next door</text>

</g>
</svg>
