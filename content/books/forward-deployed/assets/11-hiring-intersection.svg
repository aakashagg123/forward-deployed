<rect width="1200" height="980" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 11.1 — THE OPERATOR INTERSECTION</text>
<text class="h" x="64" y="122">Both capabilities are abundant. The overlap is not.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206" style="fill:#55565D">ROOM-READING ABILITY ↑</text>
<rect x="64" y="226" width="1072" height="540" fill="none" stroke="#8A8B92" stroke-width="2"/><line x1="600" y1="226" x2="600" y2="766" stroke="#8A8B92" stroke-width="2" stroke-dasharray="8 7"/><line x1="64" y1="496" x2="1136" y2="496" stroke="#8A8B92" stroke-width="2" stroke-dasharray="8 7"/>
<text class="mut" x="64" y="806">LOW</text><text class="cap mid" x="600" y="806" style="fill:#55565D">BUILD CAPABILITY →</text><text class="mut end" x="1136" y="806">HIGH</text>
<text class="lab mid" x="332" y="274" style="font-size:22px">Context without build</text>
<text class="mut mid" x="332" y="302">Management consultants</text>
<text class="mut mid" x="332" y="328">Relationship managers</text>
