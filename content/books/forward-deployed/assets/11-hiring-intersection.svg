<circle cx="265" cy="398" r="6" fill="#6A6B72" fill-opacity=".55"/>
<circle cx="156" cy="448" r="6" fill="#6A6B72" fill-opacity=".55"/>
<rect x="620" y="246" width="496" height="230" fill="#B8952B" fill-opacity=".14" stroke="#B8952B" stroke-width="3"/>
<text class="cap gold mid" x="868" y="284">THE OPERATOR</text>
<text class="body mid" x="868" y="318" style="font-size:21px">Builds production code</text>
<text class="body mid" x="868" y="348" style="font-size:21px">Reads the room independently</text>
<text class="body mid" x="868" y="378" style="font-size:21px">Earns trust by being present</text>
<text class="lab gold mid" x="868" y="426" style="font-size:20px">Sparse: not produced by any</text>
<text class="lab gold mid" x="868" y="452" style="font-size:20px">existing career path</text>
<circle cx="650" cy="270" r="8" fill="#B8952B"/>
<circle cx="1088" cy="300" r="8" fill="#B8952B"/>
<circle cx="1090" cy="440" r="8" fill="#B8952B"/>
<text class="lab mid" x="332" y="544" style="font-size:22px">Neither capability</text>
<text class="mut mid" x="332" y="572">Not in the pipeline</text>
<text class="lab mid" x="868" y="544" style="font-size:22px">Build without context</text>
<text class="mut mid" x="868" y="572">Product engineers</text>
<text class="mut mid" x="868" y="598">Services firm developers</text>
