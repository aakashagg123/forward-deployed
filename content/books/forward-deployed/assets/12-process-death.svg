<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" role="img" aria-label="How a deployment dies of correct process">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="990" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 12.3 — DEATH BY CORRECT PROCESS</text>
<text class="h" x="64" y="122">Every gate is reasonable. The sum is fatal.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<defs><marker id="garr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B0432D"/></marker></defs>
<rect x="120" y="196" width="564" height="48" fill="#B8952B" fill-opacity=".16" stroke="#B8952B" stroke-width="2.5"/><text class="cap gold mid" x="402" y="227">BUILD WINDOW · 12 WEEKS</text>
<line x1="684" y1="196" x2="684" y2="480" stroke="#B0432D" stroke-width="3" stroke-dasharray="7 6"/>
<text class="lab red" x="702" y="222" style="font-size:22px">Build window closed</text>
<text class="mut red" x="702" y="250" style="fill:#B0432D">Deployment expired, not rejected</text>
<rect x="120" y="300" width="188" height="56" fill="#B0432D" fill-opacity=".12" stroke="#B0432D" stroke-width="2.5"/><text class="lab red mid" x="214" y="335" style="font-size:20px">Procurement</text><text class="mut mid" x="214" y="392">4 weeks</text>
<rect x="308" y="300" width="188" height="56" fill="#B0432D" fill-opacity=".12" stroke="#B0432D" stroke-width="2.5"/><text class="lab red mid" x="402" y="335" style="font-size:20px">IT Governance</text><text class="mut mid" x="402" y="392">4 weeks</text>
<rect x="496" y="300" width="188" height="56" fill="#B0432D" fill-opacity=".12" stroke="#B0432D" stroke-width="2.5"/><text class="lab red mid" x="590" y="335" style="font-size:20px">Data Security</text><text class="mut mid" x="590" y="392">4 weeks</text>
<rect x="684" y="300" width="188" height="56" fill="#B0432D" fill-opacity=".12" stroke="#B0432D" stroke-width="2.5"/><text class="lab red mid" x="778" y="335" style="font-size:20px">Compliance</text><text class="mut mid" x="778" y="392">4 weeks</text>
<rect x="872" y="300" width="188" height="56" fill="#B0432D" fill-opacity=".12" stroke="#B0432D" stroke-width="2.5"/><text class="lab red mid" x="966" y="335" style="font-size:20px">PMO</text><text class="mut mid" x="966" y="392">4 weeks</text>
<line x1="120" y1="480" x2="1100" y2="480" stroke="#1C1D20" stroke-width="3"/>
<line x1="120" y1="472" x2="120" y2="488" stroke="#1C1D20" stroke-width="3"/><text class="mut mid" x="120" y="520">WEEK 0</text>
<line x1="308" y1="472" x2="308" y2="488" stroke="#1C1D20" stroke-width="3"/><text class="mut mid" x="308" y="520">WEEK 4</text>
<line x1="496" y1="472" x2="496" y2="488" stroke="#1C1D20" stroke-width="3"/><text class="mut mid" x="496" y="520">WEEK 8</text>
<line x1="684" y1="472" x2="684" y2="488" stroke="#1C1D20" stroke-width="3"/><text class="mut mid" x="684" y="520">WEEK 12</text>
<line x1="872" y1="472" x2="872" y2="488" stroke="#1C1D20" stroke-width="3"/><text class="mut mid" x="872" y="520">WEEK 16</text>
<line x1="1060" y1="472" x2="1060" y2="488" stroke="#1C1D20" stroke-width="3"/><text class="mut mid" x="1060" y="520">WEEK 20</text>
<text class="cap gold" x="120" y="590">THE FIX: PREPARATION WEEK</text>
<rect x="120" y="610" width="96" height="44" fill="#B8952B" fill-opacity=".25" stroke="#B8952B" stroke-width="2.5"/><text class="cap gold mid" x="168" y="640">PREP</text>
<rect x="226" y="610" width="200" height="44" fill="#ECEBE7" stroke="#8A8B92" stroke-width="2.5"/><text class="mut mid" x="326" y="639">Gates process</text>
<rect x="226" y="666" width="458" height="44" fill="#B8952B" fill-opacity=".12" stroke="#B8952B" stroke-width="2.5"/><text class="mut gold mid" x="455" y="695">Build runs in parallel with governance</text>
<line x1="64" y1="760" x2="1136" y2="760" stroke="#D2D1CD"/>
<text class="lab" x="64" y="804">Sequential gates on the capital clock consume the entire build window.</text>
<text class="lab" x="64" y="836">Preparation lets both clocks run in parallel.</text>
<text class="mut" x="64" y="876">Chapter 3’s two clocks, applied to the governance layer. The arithmetic is the same:</text>
<text class="mut" x="64" y="904">four slow-clock decisions is not four times harder. It is dead.</text>

</g>
</svg>
