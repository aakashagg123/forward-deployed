<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1192" width="1200" height="1192" role="img" aria-label="The forward-deployed firm versus its drift modes">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1192" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 7.3 — THE FIRM AND ITS DRIFT MODES</text>
<text class="h" x="64" y="122">Every drift is toward an incentive</text>
<text class="h" x="64" y="164">that rewards activity over change.</text>
<line x1="64" y1="194" x2="1136" y2="194" stroke="#D2D1CD"/>
<g transform="translate(0,42)">
<rect x="420" y="200" width="360" height="340" fill="#B8952B" fill-opacity=".12" stroke="#B8952B" stroke-width="2.5"/>
<text class="cap gold mid" x="600" y="240">THE FORWARD-</text>
<text class="cap gold mid" x="600" y="266">DEPLOYED FIRM</text>
<line x1="450" y1="276" x2="750" y2="276" stroke="#B8952B" stroke-opacity=".5" stroke-width="2"/>
<text class="body mid" x="600" y="316">Sells a changed workflow</text>
<text class="body mid" x="600" y="350">On a fixed clock</text>
<text class="body mid" x="600" y="384">Compounds what it learns</text>
<text class="body mid" x="600" y="418">Measures Tuesday tests passed</text>
<text class="lab gold mid" x="600" y="470" style="font-size:20px">Revenue scales with</text>
<text class="lab gold mid" x="600" y="498" style="font-size:20px">deployments, not headcount</text>
<rect x="64" y="200" width="330" height="148" fill="none" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap red" x="84" y="238">DRIFT → CONSULTING</text>
<text class="mut" x="84" y="272">Selling assessments</text>
<text class="mut" x="84" y="298">without deployment:</text>
<text class="mut" x="84" y="324">diagnosis becomes revenue</text>
<line x1="394" y1="274" x2="420" y2="274" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="806" y="200" width="330" height="148" fill="none" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap red" x="826" y="238">DRIFT → PLATFORM</text>
<text class="mut" x="826" y="272">Productising the tooling</text>
<text class="mut" x="826" y="298">instead of deploying it:</text>
<text class="mut" x="826" y="324">the GE mistake, smaller</text>
<line x1="806" y1="274" x2="780" y2="274" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="64" y="392" width="330" height="148" fill="none" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap red" x="84" y="430">DRIFT → BODY SHOP</text>
<text class="mut" x="84" y="464">Leaving operators in place</text>
<text class="mut" x="84" y="490">permanently: staff aug at</text>
<text class="mut" x="84" y="516">consulting rates</text>
<line x1="394" y1="466" x2="420" y2="466" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="806" y="392" width="330" height="148" fill="none" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap red" x="826" y="430">DRIFT → VENTURE</text>
<text class="mut" x="826" y="464">Building products for every</text>
<text class="mut" x="826" y="490">workflow fixed: each is a</text>
<text class="mut" x="826" y="516">different company</text>
<line x1="806" y1="466" x2="780" y2="466" stroke="#B0432D" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="64" y="590" width="1072" height="330" fill="none" stroke="#8A8B92" stroke-width="2"/>
<text class="cap" x="88" y="632">THE DISCIPLINES THAT PREVENT DRIFT</text>
<line x1="88" y1="654" x2="1112" y2="654" stroke="#D2D1CD"/>
<text class="lab gold" x="88" y="684" style="font-size:22px">Never sell an assessment</text>
<text class="lab gold" x="88" y="712" style="font-size:22px">without a deployment.</text>
<text class="mut" x="88" y="744">If the client wants a standalone</text>
<text class="mut" x="88" y="770">diagnosis, introduce them to a</text>
<text class="mut" x="88" y="796">consultant.</text>
<text class="lab gold" x="620" y="684" style="font-size:22px">Enforce the kill date.</text>
<text class="lab gold" x="620" y="712" style="font-size:22px">Every time.</text>
<text class="mut" x="620" y="744">An operator who stays permanently</text>
<text class="mut" x="620" y="770">has become staff augmentation.</text>
<text class="lab gold" x="88" y="850" style="font-size:22px">Keep the tooling internal.</text>
<text class="lab gold" x="88" y="878" style="font-size:22px">The product is the changed workflow.</text>
<text class="lab gold" x="620" y="850" style="font-size:22px">Hand product opportunities</text>
<text class="lab gold" x="620" y="878" style="font-size:22px">to the client. Stay focused on</text>
<text class="lab gold" x="620" y="906" style="font-size:22px">deployment.</text>
<line x1="64" y1="950" x2="1136" y2="950" stroke="#D2D1CD"/>
<text class="body" x="64" y="994">Each drift is toward a legitimate business model. Each is also a departure from the</text>
<text class="body" x="64" y="1024">one thing that makes the firm worth existing:</text>
<text class="lab gold" x="64" y="1060">a Tuesday that runs differently, owned by someone inside,</text>
<text class="lab gold" x="64" y="1092">that persists after you leave.</text>

</g>
</svg>
