<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="What holds and what needs adaptation outside India">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="900" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 15.3 — WHAT TRAVELS AND WHAT DOESN’T</text>
<text class="h" x="64" y="122">Cost structure travels easily. Density and seams do not.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206">FACTOR</text><text class="cap" x="720" y="206">HARDER TO FIND</text><text class="cap end" x="1136" y="206">TRAVELS EASILY</text>
<line x1="64" y1="226" x2="1136" y2="226" stroke="#8A8B92" stroke-width="2"/>
<rect x="64" y="246" width="1072" height="112" fill="#ECEBE7" stroke="#D2D1CD"/>
<text class="lab red" x="88" y="288" style="font-size:23px">Enterprise density</text>
<text class="mut" x="88" y="318">Korea, SE Asia family groups,</text>
<text class="mut" x="88" y="344">not US/Europe/China</text>
<rect x="720" y="286" width="392" height="30" fill="#D2D1CD"/><rect x="720" y="286" width="55" height="30" fill="#B0432D"/>
<rect x="64" y="372" width="1072" height="112" fill="#F7F6F3" stroke="#D2D1CD"/>
<text class="lab red" x="88" y="414" style="font-size:23px">Workflow multiplicity</text>
<text class="mut" x="88" y="444">Compressed-digitisation seams:</text>
<text class="mut" x="88" y="470">India and some emerging markets</text>
<rect x="720" y="412" width="392" height="30" fill="#D2D1CD"/><rect x="720" y="412" width="133" height="30" fill="#B0432D"/>
<rect x="64" y="498" width="1072" height="112" fill="#ECEBE7" stroke="#D2D1CD"/>
<text class="lab" x="88" y="540" style="font-size:23px">Talent supply</text>
<text class="mut" x="88" y="570">Volume-dependent: smaller pools</text>
<text class="mut" x="88" y="596">need slower pipelines</text>
<rect x="720" y="538" width="392" height="30" fill="#D2D1CD"/><rect x="720" y="538" width="243" height="30" fill="#8A8B92"/>
<rect x="64" y="624" width="1072" height="112" fill="#F7F6F3" stroke="#D2D1CD"/>
<text class="lab gold" x="88" y="666" style="font-size:23px">Cost structure</text>
<text class="mut" x="88" y="696">Most emerging markets:</text>
<text class="mut" x="88" y="722">the most transferable factor</text>
<rect x="720" y="664" width="392" height="30" fill="#D2D1CD"/><rect x="720" y="664" width="361" height="30" fill="#B8952B"/>
<line x1="64" y1="774" x2="1136" y2="774" stroke="#D2D1CD"/>
<text class="lab" x="64" y="818">A firm exporting the model should rebuild the sizing exercise factor</text>
<text class="lab" x="64" y="850">by factor, not assume the multiplier holds.</text>

</g>
</svg>
