<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 878" width="1200" height="878" role="img" aria-label="Five talent sources for the operator pipeline">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="878" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 11.2 — THE FIVE TALENT SOURCES</text>
<text class="h" x="64" y="122">Each source has a different gap to close.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206">SOURCE</text><text class="cap" x="420" y="206">STRENGTH</text><text class="cap" x="810" y="206">GAP</text>
<line x1="64" y1="222" x2="1136" y2="222" stroke="#8A8B92" stroke-width="2"/>
<rect x="64" y="238" width="1072" height="110" fill="#ECEBE7" stroke="#D2D1CD"/>
<text class="lab" x="84" y="280" style="font-size:22px">Startup founders</text>
<text class="mut" x="84" y="310">and early employees</text>
<text class="body" x="420" y="280" style="font-size:20px">Built, shipped, dealt with</text>
<text class="body" x="420" y="306" style="font-size:20px">customers directly. Full-cycle</text>
<text class="body" x="420" y="332" style="font-size:20px">experience.</text>
<text class="cap red" x="810" y="276">GAP: PACE</text>
<text class="mut" x="810" y="306">Too fast, too impatient</text>
<text class="mut" x="810" y="332">with enterprise tempo</text>
<rect x="64" y="360" width="1072" height="110" fill="#F7F6F3" stroke="#D2D1CD"/>
<text class="lab" x="84" y="402" style="font-size:22px">Product engineers</text>
<text class="mut" x="84" y="432">with customer rotations</text>
<text class="body" x="420" y="402" style="font-size:20px">Taste of the room from</text>
<text class="body" x="420" y="428" style="font-size:20px">implementation stints at clients</text>
<text class="cap red" x="810" y="398">GAP: DEPTH</text>
<text class="mut" x="810" y="428">Not enough organisational</text>
<text class="mut" x="810" y="454">exposure to navigate alone</text>
<rect x="64" y="482" width="1072" height="110" fill="#ECEBE7" stroke="#D2D1CD"/>
<text class="lab" x="84" y="524" style="font-size:22px">Services firm engineers</text>
<text class="mut" x="84" y="554">who exceeded their role</text>
<text class="body" x="420" y="524" style="font-size:20px">Built client relationships</text>
<text class="body" x="420" y="550" style="font-size:20px">against the structure</text>
<text class="cap red" x="810" y="520">GAP: AGENCY</text>
<text class="mut" x="810" y="550">Trained to deliver specs,</text>
<text class="mut" x="810" y="576">not question them</text>
<rect x="64" y="604" width="1072" height="110" fill="#F7F6F3" stroke="#D2D1CD"/>
<text class="lab" x="84" y="646" style="font-size:22px">Consultants who code</text>
<text class="mut" x="84" y="676">Big Four / strategy associates</text>
<text class="body" x="420" y="646" style="font-size:20px">Room-reading already trained</text>
<text class="body" x="420" y="672" style="font-size:20px">at high level</text>
<text class="cap red" x="810" y="642">GAP: BUILD</text>
<text class="mut" x="810" y="672">Self-taught code, not</text>
<text class="mut" x="810" y="698">production-grade</text>
<rect x="64" y="726" width="1072" height="110" fill="#ECEBE7" stroke="#D2D1CD"/>
<text class="lab" x="84" y="768" style="font-size:22px">Domain experts</text>
<text class="mut" x="84" y="798">who learned technology</text>
<text class="body" x="420" y="768" style="font-size:20px">Already trusted by their own</text>
<text class="body" x="420" y="794" style="font-size:20px">organisation</text>
<text class="cap red" x="810" y="764">GAP: PERSPECTIVE</text>
<text class="mut" x="810" y="794">Cannot see own org</text>
<text class="mut" x="810" y="820">from the outside yet</text>

</g>
</svg>
