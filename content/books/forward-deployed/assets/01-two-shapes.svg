<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Centre-out transformation versus perimeter-in deployment">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="860" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 1.3 — TWO SHAPES OF CHANGE</text>
<text class="h" x="64" y="122">Same objective. Opposite topology.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="600" y1="186" x2="600" y2="810" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">CENTRE-OUT</text>
<circle cx="320" cy="500" r="235" fill="none" stroke="#1C1D20" stroke-width="2"/>
<circle cx="320" cy="500" r="150" fill="none" stroke="#D2D1CD" stroke-width="1.5"/>
<circle cx="320" cy="500" r="90" fill="none" stroke="#D2D1CD" stroke-width="1.5"/>
<line x1="386.0" y1="500.0" x2="548.0" y2="500.0" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="366.7" y1="546.7" x2="481.2" y2="661.2" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="320.0" y1="566.0" x2="320.0" y2="728.0" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="273.3" y1="546.7" x2="158.8" y2="661.2" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="254.0" y1="500.0" x2="92.0" y2="500.0" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="273.3" y1="453.3" x2="158.8" y2="338.8" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="320.0" y1="434.0" x2="320.0" y2="272.0" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<line x1="366.7" y1="453.3" x2="481.2" y2="338.8" stroke="#1C1D20" stroke-width="1.6" opacity=".4"/>
<circle cx="320" cy="500" r="62" fill="#1C1D20"/>
<text class="cap inv mid" x="320" y="496" style="letter-spacing:1px">TRANSF.</text>
<text class="cap inv mid" x="320" y="520" style="letter-spacing:1px">OFFICE</text>
<text class="note mid" x="320" y="250">The work lives out here ↓</text>
<text class="lab mid" x="320" y="790">Resolution lost at every ring.</text>
<text class="mut mid" x="320" y="822">The instruction never reaches the edge.</text>
<text class="cap" x="660" y="206">PERIMETER-IN</text>
<circle cx="880" cy="500" r="235" fill="none" stroke="#1C1D20" stroke-width="2"/>
<circle cx="880" cy="500" r="150" fill="none" stroke="#D2D1CD" stroke-width="1.5"/>
<circle cx="880" cy="500" r="90" fill="none" stroke="#D2D1CD" stroke-width="1.5"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8952B"/></marker></defs>
<path d="M1046 380 L 990 436" stroke="#B8952B" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M1059 352 A 235 235 0 0 1 1010 660" stroke="#B8952B" stroke-width="2.5" fill="none" stroke-dasharray="7 8"/>
<path d="M1059 352 A 235 235 0 0 0 800 270" stroke="#B8952B" stroke-width="2.5" fill="none" stroke-dasharray="7 8"/>
<circle cx="1059" cy="352" r="16" fill="#B8952B"/>
<text class="cap gold end" x="1138" y="300">OPERATOR</text>
<text class="lab mid" x="880" y="790">Starts at the work.</text>
<text class="mut mid" x="880" y="822">Pulls the org toward what already runs.</text>

</g>
</svg>
