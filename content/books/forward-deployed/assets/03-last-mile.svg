<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The demo versus what production requires">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#1C1D20}
.note{font-size:12.5px;fill:#7A7B82}
.seg{font-size:12.5px;letter-spacing:1.4px;fill:#1C1D20}
</style>
<rect width="1200" height="620" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 3.3 — THE LAST TWENTY PERCENT</text>
<text class="t h" x="64" y="112">Eighty percent of the functionality. Twenty percent of the work.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<text class="t col" x="64" y="204">THE DEMO</text>
<text class="t note" x="330" y="204" fill="#7A7B82">built in a fortnight · shown at a review · applauded</text>
<rect x="64" y="222" width="260" height="72" fill="#1C1D20"/>
<text class="t" x="194" y="266" text-anchor="middle" font-size="14" letter-spacing="1.6" fill="#F7F6F3">VISIBLE FUNCTIONALITY</text>

<text class="t col" x="64" y="368">WHAT PRODUCTION REQUIRES</text>
<text class="t note" x="430" y="368" fill="#7A7B82">not engineering polish — organisational reality</text>
<g fill="none" stroke="#1C1D20" stroke-width="1.4">
<rect x="64" y="386" width="200" height="72"/>
<rect x="264" y="386" width="240" height="72"/>
<rect x="504" y="386" width="240" height="72"/>
<rect x="744" y="386" width="200" height="72"/>
<rect x="944" y="386" width="192" height="72"/>
</g>
<g fill="#C8553D" opacity="0.13">
<rect x="64" y="386" width="200" height="72"/><rect x="264" y="386" width="240" height="72"/>
<rect x="504" y="386" width="240" height="72"/><rect x="744" y="386" width="200" height="72"/>
<rect x="944" y="386" width="192" height="72"/>
</g>
<g class="t seg" text-anchor="middle">
<text x="164" y="418">IDENTITY &amp;</text><text x="164" y="436">PERMISSIONS</text>
<text x="384" y="418">THE REAL</text><text x="384" y="436">DATA</text>
<text x="624" y="418">EXCEPTION</text><text x="624" y="436">CASES</text>
<text x="844" y="418">SYSTEM-OF-RECORD</text><text x="844" y="436">INTEGRATION</text>
<text x="1040" y="418">TRAINING &amp; CLOSING</text><text x="1040" y="436">THE OLD PATH</text>
</g>
<g class="t note" text-anchor="middle" font-size="11.5" fill="#6A6B72">
<text x="164" y="486">varies by region, role,</text><text x="164" y="504">customer and three</text><text x="164" y="522">historical exceptions</text>
<text x="384" y="486">duplicate customers with</text><text x="384" y="504">three spellings; dates as</text><text x="384" y="522">text; eleven status values</text>
<text x="624" y="486">the documented process</text><text x="624" y="504">covers ~70%; the rest lives</text><text x="624" y="522">in one person's recognition</text>
<text x="844" y="486">until the output lands here,</text><text x="844" y="504">you have built a parallel</text><text x="844" y="522">process — and it will lose</text>
<text x="1040" y="486">someone must be told to</text><text x="1040" y="504">stop; someone's report</text><text x="1040" y="522">must change</text>
</g>

<line x1="64" y1="560" x2="1136" y2="560" stroke="#D2D1CD"/>
<text class="t" x="64" y="594" font-size="16" fill="#4A4B50">“AI can build it in a weekend” is true, and buys you the top bar. Nobody has ever been paid for the top bar.</text>
</svg>
