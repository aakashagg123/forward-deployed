<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The spectrum from advisory to embedded deployment">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#6A6B72}
.note{font-size:13px;fill:#7A7B82}
.lbl{font-size:15px;fill:#1C1D20}
.dim{font-size:13px;fill:#7A7B82}
</style>
<rect width="1200" height="600" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 13.1 — THE ENGAGEMENT SPECTRUM</text>
<text class="t h" x="64" y="112">Four models. Only one delivers the change itself.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<!-- Spectrum arrow -->
<text class="t col" x="64" y="196">LOW ACCOUNTABILITY</text>
<text class="t col" x="1136" y="196" text-anchor="end">HIGH ACCOUNTABILITY</text>
<line x1="120" y1="216" x2="1080" y2="216" stroke="#D2D1CD" stroke-width="2"/>
<defs><marker id="sarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D2D1CD"/></marker></defs>
<line x1="1070" y1="216" x2="1080" y2="216" stroke="#D2D1CD" stroke-width="2" marker-end="url(#sarr)"/>

<!-- Model 1: Advisory / Consulting -->
<rect x="84" y="248" width="230" height="240" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t lbl" x="199" y="280" text-anchor="middle">Advisory</text>
<text class="t dim" x="199" y="300" text-anchor="middle">Strategy &amp; management</text>
<text class="t dim" x="199" y="320" text-anchor="middle">consulting</text>
<line x1="114" y1="338" x2="284" y2="338" stroke="#D2D1CD"/>
<text class="t dim" x="104" y="362">Delivers: recommendations</text>
<text class="t dim" x="104" y="382">Stays: weeks to months</text>
<text class="t dim" x="104" y="402">Prices: by seniority × days</text>
<text class="t dim" x="104" y="422">Accountable for: analysis</text>
<text class="t dim" x="104" y="452">After engagement: deck</text>
<text class="t dim" x="104" y="472">on a shared drive</text>

<!-- Model 2: Staff Augmentation -->
<rect x="334" y="248" width="230" height="240" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t lbl" x="449" y="280" text-anchor="middle">Staff augmentation</text>
<text class="t dim" x="449" y="300" text-anchor="middle">IT services,</text>
<text class="t dim" x="449" y="320" text-anchor="middle">body-shopping</text>
<line x1="364" y1="338" x2="534" y2="338" stroke="#D2D1CD"/>
<text class="t dim" x="354" y="362">Delivers: people</text>
<text class="t dim" x="354" y="382">Stays: months to years</text>
<text class="t dim" x="354" y="402">Prices: by rate × headcount</text>
<text class="t dim" x="354" y="422">Accountable for: attendance</text>
<text class="t dim" x="354" y="452">After engagement:</text>
<text class="t dim" x="354" y="472">dependency on vendor</text>

<!-- Model 3: Managed Services -->
<rect x="584" y="248" width="230" height="240" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t lbl" x="699" y="280" text-anchor="middle">Managed services</text>
<text class="t dim" x="699" y="300" text-anchor="middle">Outsourced process,</text>
<text class="t dim" x="699" y="320" text-anchor="middle">BPO, run-the-shop</text>
<line x1="614" y1="338" x2="784" y2="338" stroke="#D2D1CD"/>
<text class="t dim" x="604" y="362">Delivers: SLA compliance</text>
<text class="t dim" x="604" y="382">Stays: years</text>
<text class="t dim" x="604" y="402">Prices: per transaction</text>
<text class="t dim" x="604" y="422">Accountable for: uptime</text>
<text class="t dim" x="604" y="452">After engagement:</text>
<text class="t dim" x="604" y="472">re-insourcing project</text>

<!-- Model 4: Forward-Deployed (highlighted) -->
<rect x="834" y="248" width="230" height="240" rx="8" fill="#B8952B" opacity="0.10" stroke="#B8952B" stroke-width="1.5"/>
<text class="t lbl" x="949" y="280" text-anchor="middle" fill="#B8952B">Forward-deployed</text>
<text class="t dim" x="949" y="300" text-anchor="middle">Embedded operator,</text>
<text class="t dim" x="949" y="320" text-anchor="middle">builds and rewires</text>
<line x1="864" y1="338" x2="1034" y2="338" stroke="#B8952B" opacity="0.4"/>
<text class="t" x="854" y="362" font-size="13" fill="#1C1D20">Delivers: changed workflow</text>
<text class="t" x="854" y="382" font-size="13" fill="#1C1D20">Stays: 12 weeks</text>
<text class="t" x="854" y="402" font-size="13" fill="#1C1D20">Prices: base + value share</text>
<text class="t" x="854" y="422" font-size="13" fill="#1C1D20">Accountable for: outcome</text>
<text class="t" x="854" y="452" font-size="13" fill="#1C1D20">After engagement:</text>
<text class="t" x="854" y="472" font-size="13" fill="#1C1D20">system still running</text>

<line x1="64" y1="530" x2="1136" y2="530" stroke="#D2D1CD"/>
<text class="t" x="64" y="562" font-size="16" fill="#4A4B50">The market treats these as variations on a theme. They are different businesses with different economics, different talent, and different failure modes.</text>
</svg>
