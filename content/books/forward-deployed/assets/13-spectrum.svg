<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970" role="img" aria-label="The spectrum from advisory to embedded deployment">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="970" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 13.1 — THE ENGAGEMENT SPECTRUM</text>
<text class="h" x="64" y="122">Four models. Only one delivers the change itself.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206" style="fill:#55565D">LOW ACCOUNTABILITY</text><text class="cap end" x="1136" y="206" style="fill:#55565D">HIGH ACCOUNTABILITY</text>
<defs><marker id="sa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A8B92"/></marker></defs><line x1="64" y1="232" x2="1126" y2="232" stroke="#8A8B92" stroke-width="3" marker-end="url(#sa)"/>
<rect x="921" y="260" width="217" height="560" fill="#B8952B" fill-opacity=".14"/>
<text class="lab" x="280" y="296" style="font-size:21px">Advisory</text>
<text class="mut" x="280" y="326">Strategy &amp;</text>
<text class="mut" x="280" y="352">management</text>
<text class="mut" x="280" y="378">consulting</text>
<text class="lab" x="497" y="296" style="font-size:21px">Staff augmentation</text>
<text class="mut" x="497" y="326">IT services,</text>
<text class="mut" x="497" y="352">body-shopping</text>
<text class="lab" x="714" y="296" style="font-size:21px">Managed services</text>
<text class="mut" x="714" y="326">Outsourced process,</text>
<text class="mut" x="714" y="352">BPO, run-the-shop</text>
<text class="lab gold" x="931" y="296" style="font-size:21px">Forward-deployed</text>
<text class="mut" x="931" y="326">Embedded operator,</text>
<text class="mut" x="931" y="352">builds and rewires</text>
<line x1="64" y1="404" x2="1136" y2="404" stroke="#8A8B92" stroke-width="2"/>
<text class="cap" x="64" y="442" style="fill:#55565D">DELIVERS</text>
<text class="body" x="280" y="442" style="font-size:21px;">recommendations</text>
<text class="body" x="497" y="442" style="font-size:21px;">people</text>
<text class="body" x="714" y="442" style="font-size:21px;">SLA compliance</text>
<text class="body gold" x="931" y="442" style="font-size:21px;font-weight:700">changed workflow</text>
<line x1="64" y1="474" x2="1136" y2="474" stroke="#D2D1CD"/>
<text class="cap" x="64" y="512" style="fill:#55565D">STAYS</text>
<text class="body" x="280" y="512" style="font-size:21px;">weeks to months</text>
<text class="body" x="497" y="512" style="font-size:21px;">months to years</text>
<text class="body" x="714" y="512" style="font-size:21px;">years</text>
<text class="body gold" x="931" y="512" style="font-size:21px;font-weight:700">12 weeks</text>
<line x1="64" y1="544" x2="1136" y2="544" stroke="#D2D1CD"/>
<text class="cap" x="64" y="582" style="fill:#55565D">PRICES</text>
<text class="body" x="280" y="582" style="font-size:21px;">by seniority × days</text>
<text class="body" x="497" y="582" style="font-size:21px;">by rate × headcount</text>
<text class="body" x="714" y="582" style="font-size:21px;">per transaction</text>
<text class="body gold" x="931" y="582" style="font-size:21px;font-weight:700">base + value share</text>
<line x1="64" y1="614" x2="1136" y2="614" stroke="#D2D1CD"/>
<text class="cap" x="64" y="652" style="fill:#55565D">ACCOUNTABLE</text>
<text class="cap" x="64" y="678" style="fill:#55565D">FOR</text>
<text class="body" x="280" y="652" style="font-size:21px;">analysis</text>
<text class="body" x="497" y="652" style="font-size:21px;">attendance</text>
<text class="body" x="714" y="652" style="font-size:21px;">uptime</text>
<text class="body gold" x="931" y="652" style="font-size:21px;font-weight:700">outcome</text>
<line x1="64" y1="710" x2="1136" y2="710" stroke="#D2D1CD"/>
<text class="cap" x="64" y="748" style="fill:#55565D">AFTER</text>
<text class="cap" x="64" y="774" style="fill:#55565D">ENGAGEMENT</text>
<text class="body" x="280" y="748" style="font-size:21px;">deck on a</text>
<text class="body" x="280" y="774" style="font-size:21px;">shared drive</text>
<text class="body" x="497" y="748" style="font-size:21px;">dependency</text>
<text class="body" x="497" y="774" style="font-size:21px;">on vendor</text>
<text class="body" x="714" y="748" style="font-size:21px;">re-insourcing</text>
<text class="body" x="714" y="774" style="font-size:21px;">project</text>
<text class="body gold" x="931" y="748" style="font-size:21px;font-weight:700">system still</text>
<text class="body gold" x="931" y="774" style="font-size:21px;font-weight:700">running</text>
<line x1="64" y1="820" x2="1136" y2="820" stroke="#D2D1CD"/>
<line x1="64" y1="844" x2="1136" y2="844" stroke="#D2D1CD"/>
<text class="lab" x="64" y="888">The market treats these as variations on a theme. They are different</text>
<text class="lab" x="64" y="920">businesses with different economics, different talent, and different failure modes.</text>

</g>
</svg>
