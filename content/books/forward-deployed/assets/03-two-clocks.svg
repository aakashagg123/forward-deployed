<text class="cap" x="64" y="750">BUILD CLOCK · the digital business</text>
<text class="mut" x="64" y="780">calibrated to information that arrives from shipping</text>
<defs><marker id="up" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B0432D"/></marker></defs>
<circle cx="228" cy="640" r="9" fill="#B0432D"/>
<path d="M232 628 C 300 520 540 440 628 346" stroke="#B0432D" stroke-width="3" fill="none" marker-end="url(#up)"/>
<text class="cap red mid" x="431" y="604">THE QUEUE</text>
<text class="lab red" x="670" y="388" style="font-size:22px">A two-day question enters</text>
<text class="lab red" x="670" y="418" style="font-size:22px">a ninety-day queue.</text>
<text class="mut" x="670" y="462">One data access. One policy sign-off.</text>
<text class="mut" x="670" y="490">One change to a system of record.</text>
<text class="mut" x="670" y="518">Nobody replans, so the plan quietly</text>
<text class="mut" x="670" y="546">becomes fiction, and the team builds</text>
<text class="mut" x="670" y="574">the thing that needs no permission:</text>
<text class="mut" x="670" y="602">something adjacent to the point.</text>
<line x1="64" y1="826" x2="1136" y2="826" stroke="#D2D1CD"/>
<text class="lab" x="64" y="870">A deployment needing four slow-clock decisions is not four</text>
<text class="lab" x="64" y="902">times harder than one. It is roughly dead.</text>
<text class="mut" x="64" y="942">Mismatched clocks do not synchronise by being asked to. Design deployments</text>
<text class="mut" x="64" y="970">that spend as few slow-clock decisions as possible.</text>

</g>
