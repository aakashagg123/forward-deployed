<text class="kicker" x="64" y="72">FIGURE 3.1 — THE TWO CLOCKS</text>
<text class="h" x="64" y="122">Both are correct. The value leaks at the interface.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
