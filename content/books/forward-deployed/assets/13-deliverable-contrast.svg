<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" width="1200" height="1020" role="img" aria-label="What consulting delivers versus what forward deployment delivers">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1020" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 13.2 — THE DELIVERABLE CONTRAST</text>
<text class="h" x="64" y="122">One column describes the change. The other is the change.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="cap" x="64" y="206">WHAT CONSULTING DELIVERS</text><text class="cap" x="660" y="206">WHAT FORWARD DEPLOYMENT DELIVERS</text>
<line x1="64" y1="226" x2="540" y2="226" stroke="#8A8B92" stroke-width="2"/><line x1="660" y1="226" x2="1136" y2="226" stroke="#B8952B" stroke-width="3"/>
<line x1="600" y1="186" x2="600" y2="790" stroke="#D2D1CD"/>
<circle cx="600" cy="500" r="22" fill="#F7F6F3" stroke="#8A8B92" stroke-width="2"/><text class="lab gold mid" x="600" y="509">→</text>
<text class="body" x="64" y="286" style="fill:#55565D">The process assessment</text>
<text class="lab" x="660" y="286" style="font-size:22px">The process, changed</text>
<text class="body" x="64" y="364" style="fill:#55565D">The technology recommendation</text>
<text class="lab" x="660" y="364" style="font-size:22px">The code, running in production</text>
<text class="body" x="64" y="442" style="fill:#55565D">The change management plan</text>
<text class="lab" x="660" y="442" style="font-size:22px">The old path, switched off</text>
<text class="body" x="64" y="520" style="fill:#55565D">The business case</text>
<text class="lab" x="660" y="520" style="font-size:22px">The metric, moved</text>
<text class="body" x="64" y="598" style="fill:#55565D">The stakeholder map</text>
<text class="lab" x="660" y="598" style="font-size:22px">The team, trained and owning it</text>
<text class="body" x="64" y="676" style="fill:#55565D">The implementation roadmap</text>
<text class="lab" x="660" y="676" style="font-size:22px">The implementation, complete</text>
<text class="body" x="64" y="754" style="fill:#55565D">The final presentation</text>
<text class="lab" x="660" y="754" style="font-size:22px">A WhatsApp message at 10 PM when</text>
<text class="lab" x="660" y="782" style="font-size:22px">it breaks</text>
<line x1="64" y1="836" x2="1136" y2="836" stroke="#D2D1CD"/>
<text class="lab" x="64" y="880">Nothing on the left is dishonest. Nothing on the left changes the</text>
<text class="lab" x="64" y="912">organisation. The right column is accountable for the outcome.</text>

</g>
</svg>
