<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="The cost collapse: old team versus new unit">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#1C1D20}
.role{font-size:14px;letter-spacing:1.2px;fill:#F7F6F3}
.cost{font-size:13px;fill:#7A7B82}
.big{font-size:30px;fill:#1C1D20}
.note{font-size:12.5px;fill:#7A7B82}
</style>
<rect width="1200" height="780" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 6.1 — THE COST COLLAPSE</text>
<text class="t h" x="64" y="112">Same scope. One-tenth the cost. One-third the time.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>
<line x1="600" y1="176" x2="600" y2="620" stroke="#E4E3DF"/>

<!-- LEFT: OLD MODEL -->
<text class="t col" x="64" y="204">THE OLD UNIT · 6–9 MONTHS</text>
<g fill="#1C1D20">
<rect x="64" y="226" width="470" height="36"/>
<rect x="64" y="270" width="470" height="36"/>
<rect x="64" y="314" width="470" height="36"/>
<rect x="64" y="358" width="470" height="36"/>
<rect x="64" y="402" width="470" height="36"/>
<rect x="64" y="446" width="470" height="36"/>
</g>
<g class="t role">
<text x="84" y="250">Business analyst</text>
<text x="84" y="294">Application developer</text>
<text x="84" y="338">Data engineer</text>
<text x="84" y="382">QA / test engineer</text>
<text x="84" y="426">Integration engineer</text>
<text x="84" y="470">Project manager</text>
</g>
<g class="t cost" text-anchor="end">
<text x="514" y="250">$80–150k</text>
<text x="514" y="294">$120–200k</text>
<text x="514" y="338">$100–180k</text>
<text x="514" y="382">$80–140k</text>
<text x="514" y="426">$100–160k</text>
<text x="514" y="470">$70–120k</text>
</g>
<text class="t big" x="64" y="536" fill="#C8553D">$500k–$2M</text>
<text class="t note" x="64" y="564" fill="#7A7B82">Minimum viable engagement. Sets a threshold that</text>
<text class="t note" x="64" y="586" fill="#C8553D">excludes every workflow below ~$250k annual value.</text>

<!-- RIGHT: NEW MODEL -->
<text class="t col" x="660" y="204">THE NEW UNIT · 6–12 WEEKS</text>
<rect x="660" y="226" width="470" height="36" fill="#B8952B"/>
<text class="t role" x="680" y="250">The operator</text>
<text class="t cost" x="1110" y="250" text-anchor="end">$40–80k</text>

<rect x="660" y="270" width="470" height="200" fill="none" stroke="#B8952B" stroke-width="1.4" stroke-dasharray="6 5"/>
<text class="t" x="680" y="296" font-size="13" letter-spacing="2.4" fill="#B8952B">THE MACHINE</text>
<g class="t note" fill="#4A4B50">
<text x="680" y="324">writes the application</text>
<text x="680" y="348">reads the schema</text>
<text x="680" y="372">produces integration scaffolding</text>
<text x="680" y="396">generates test cases</text>
<text x="680" y="420">writes handover documentation</text>
<text x="680" y="444">marginal cost ≈ $0</text>
</g>

<text class="t big" x="660" y="536" fill="#B8952B">$40k–$80k</text>
<text class="t note" x="660" y="564" fill="#4A4B50">Threshold drops below most workflows.</text>
<text class="t note" x="660" y="586" fill="#B8952B">The thousand wounds now qualify.</text>

<!-- bottom bar -->
<rect x="64" y="630" width="1072" height="60" fill="#C8553D" opacity="0.10"/>
<text class="t" x="84" y="652" font-size="12.5" letter-spacing="2.6" fill="#C8553D">WHAT THIS CHANGES</text>
<text class="t note" x="84" y="676" fill="#4A4B50">Not a cheaper version of the same service. A different class of problem becomes fundable. The operating model, for the first time, is below the line.</text>

<text class="t note" x="64" y="746" font-size="13" fill="#7A7B82">The reduction is roughly ten to one — the same ratio Brynjolfsson found between technology investment and organisational capital.</text>
</svg>
