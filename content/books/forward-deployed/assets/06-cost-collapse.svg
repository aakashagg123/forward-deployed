<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" role="img" aria-label="The cost collapse: old team versus new unit">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1060" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 6.1 — THE COST COLLAPSE</text>
<text class="h" x="64" y="122">Same scope. One-tenth the cost. One-third the time.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="600" y1="186" x2="600" y2="760" stroke="#D2D1CD"/>
<text class="cap" x="64" y="206">THE OLD UNIT · 6–9 MONTHS</text>
<rect x="64" y="232" width="496" height="48" fill="#1C1D20"/><text class="body inv" x="84" y="264">Business analyst</text><text class="mut inv end" x="540" y="264">$80–150k</text>
<rect x="64" y="292" width="496" height="48" fill="#1C1D20"/><text class="body inv" x="84" y="324">Application developer</text><text class="mut inv end" x="540" y="324">$120–200k</text>
<rect x="64" y="352" width="496" height="48" fill="#1C1D20"/><text class="body inv" x="84" y="384">Data engineer</text><text class="mut inv end" x="540" y="384">$100–180k</text>
<rect x="64" y="412" width="496" height="48" fill="#1C1D20"/><text class="body inv" x="84" y="444">QA / test engineer</text><text class="mut inv end" x="540" y="444">$80–140k</text>
<rect x="64" y="472" width="496" height="48" fill="#1C1D20"/><text class="body inv" x="84" y="504">Integration engineer</text><text class="mut inv end" x="540" y="504">$100–160k</text>
<rect x="64" y="532" width="496" height="48" fill="#1C1D20"/><text class="body inv" x="84" y="564">Project manager</text><text class="mut inv end" x="540" y="564">$70–120k</text>
<text class="cap" x="640" y="206">THE NEW UNIT · 6–12 WEEKS</text>
<rect x="640" y="232" width="496" height="48" fill="#B8952B"/><text class="body" x="660" y="264" style="font-weight:700">The operator</text><text class="mut end" x="1116" y="264" style="fill:#1C1D20">$40–80k</text>
<rect x="640" y="296" width="496" height="264" fill="none" stroke="#B8952B" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap gold" x="662" y="334">THE MACHINE</text>
<text class="body" x="662" y="374">writes the application</text>
<text class="body" x="662" y="406">reads the schema</text>
<text class="body" x="662" y="438">produces integration scaffolding</text>
<text class="body" x="662" y="470">generates test cases</text>
<text class="body" x="662" y="502">writes handover documentation</text>
<text class="body" x="662" y="534">marginal cost ≈ $0</text>
<text class="red" x="64" y="660" style="font-size:56px;font-weight:700">$500k–$2M</text>
<text class="gold" x="640" y="660" style="font-size:56px;font-weight:700">$40k–$80k</text>
<text class="mut red" x="64" y="704">Minimum viable engagement. Sets a</text>
<text class="mut red" x="64" y="732">threshold that excludes every workflow</text>
<text class="mut red" x="64" y="760">below ~$250k annual value.</text>
<text class="mut" x="640" y="704">Threshold drops below most workflows.</text>
<text class="mut gold" x="640" y="732">The thousand wounds now qualify.</text>
<rect x="64" y="800" width="1072" height="130" fill="#B0432D" fill-opacity=".10"/>
<text class="cap red" x="88" y="840">WHAT THIS CHANGES</text>
<text class="body" x="88" y="874">Not a cheaper version of the same service. A different class of problem becomes</text>
<text class="body" x="88" y="904">fundable. The operating model, for the first time, is below the line.</text>

</g>
<line x1="64" y1="956" x2="1136" y2="956" stroke="#D2D1CD"/>
<text class="note" x="64" y="996">The reduction is roughly ten to one, the same ratio Brynjolfsson found between</text>
<text class="note" x="64" y="1024">technology investment and organisational capital.</text>
</svg>
