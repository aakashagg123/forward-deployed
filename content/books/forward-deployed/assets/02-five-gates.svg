<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-label="The five gates where AI adoption breaks">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="880" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 2.4 — WHERE ADOPTION ACTUALLY BREAKS</text>
<text class="h" x="64" y="122">Enterprises measure the two gates they can procure</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<line x1="64" y1="256" x2="492" y2="256" stroke="#1C1D20" stroke-width="2"/><line x1="64" y1="256" x2="64" y2="272" stroke="#1C1D20" stroke-width="2"/><line x1="492" y1="256" x2="492" y2="272" stroke="#1C1D20" stroke-width="2"/>
<text class="cap mid" x="278" y="208">MEASURED · BUDGETED</text>
<text class="cap mid" x="278" y="234">PROCURABLE</text>
<line x1="520" y1="256" x2="1136" y2="256" stroke="#B0432D" stroke-width="2"/><line x1="520" y1="256" x2="520" y2="272" stroke="#B0432D" stroke-width="2"/><line x1="1136" y1="256" x2="1136" y2="272" stroke="#B0432D" stroke-width="2"/>
<text class="cap red mid" x="828" y="234">NO VENDOR · NO BUDGET LINE · NO OWNER</text>
<path d="M64 320 H278 V330 H492 V370 H706 V400 H920 V420 H1136 V520 H920 V540 H706 V570 H492 V610 H278 V620 H64 Z" fill="#1C1D20" fill-opacity="0.12" stroke="#1C1D20" stroke-width="2"/>
<g stroke="#F7F6F3" stroke-width="3"><line x1="278" y1="322" x2="278" y2="618"/><line x1="492" y1="332" x2="492" y2="608"/><line x1="706" y1="372" x2="706" y2="568"/><line x1="920" y1="402" x2="920" y2="538"/></g>
<text class="cap mid" x="171" y="476" style="letter-spacing:1px">CAPABILITY</text>
<text class="mut mid" x="171" y="680">the model is better</text>
<text class="mut mid" x="171" y="708">than the task</text>
<text class="mut mid" x="171" y="736">requires</text>
<text class="cap mid" x="385" y="476" style="letter-spacing:1px">ACCESS</text>
<text class="mut mid" x="385" y="680">licences bought,</text>
<text class="mut mid" x="385" y="708">SSO works</text>
<text class="cap mid" x="599" y="476" style="letter-spacing:1px">WORKFLOW FIT</text>
<text class="mut mid red" x="599" y="680">output lands in</text>
<text class="mut mid red" x="599" y="708">a chat window; the</text>
<text class="mut mid red" x="599" y="736">work happens in</text>
<text class="mut mid red" x="599" y="764">the ERP</text>
<text class="cap mid" x="813" y="476" style="letter-spacing:1px">AUTHORITY</text>
<text class="mut mid red" x="813" y="680">whoever can see</text>
<text class="mut mid red" x="813" y="708">the fix cannot</text>
<text class="mut mid red" x="813" y="736">make it</text>
<text class="cap mid" x="1027" y="476" style="letter-spacing:1px">INCENTIVE</text>
<text class="mut mid red" x="1027" y="680">the fix changes</text>
<text class="mut mid red" x="1027" y="708">someone’s numbers</text>

</g>
<line x1="64" y1="804" x2="1136" y2="804" stroke="#D2D1CD"/>
<text class="note" x="64" y="844">Attrition is not distributed. It clusters in the three layers nobody owns.</text>
</svg>
