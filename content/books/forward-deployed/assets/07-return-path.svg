<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1360" width="1200" height="1360" role="img" aria-label="The return path: how deployments compound">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1360" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 7.2 — THE RETURN PATH</text>
<text class="h" x="64" y="122">Each deployment accelerates the next. That is the asset.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8952B"/></marker></defs>
<rect x="64" y="190" width="316" height="350" fill="none" stroke="#8A8B92" stroke-width="2.5"/>
<text class="cap" x="84" y="228">DEPLOYMENT 1</text>
<rect x="84" y="246" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="96" y="272" style="font-size:20px">Schema discovery</text>
<rect x="84" y="292" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="96" y="318" style="font-size:20px">Integration patterns</text>
<rect x="84" y="338" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="96" y="364" style="font-size:20px">Exception structures</text>
<rect x="84" y="384" width="276" height="38" fill="#B8952B" fill-opacity=".22"/><text class="mut gold" x="96" y="410" style="font-size:20px">The wound (specific)</text>
<rect x="84" y="430" width="276" height="38" fill="#B8952B" fill-opacity=".22"/><text class="mut gold" x="96" y="456" style="font-size:20px">The politics (specific)</text>
<text x="84" y="520" style="font-size:36px;font-weight:700;fill:#B0432D">12 weeks</text>
<line x1="222" y1="540" x2="222" y2="594" stroke="#B8952B" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah)"/>
<line x1="390" y1="450" x2="436" y2="450" stroke="#B8952B" stroke-width="3" marker-end="url(#ah)"/>
<rect x="442" y="236" width="316" height="304" fill="none" stroke="#8A8B92" stroke-width="2.5"/>
<text class="cap" x="462" y="274">DEPLOYMENT 10</text>
<rect x="462" y="292" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="474" y="318" style="font-size:20px">reused from library</text>
<rect x="462" y="338" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="474" y="364" style="font-size:20px">reused from library</text>
<rect x="462" y="384" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="474" y="410" style="font-size:20px">reused from library</text>
<rect x="462" y="430" width="276" height="38" fill="#B8952B" fill-opacity=".22"/><text class="mut gold" x="474" y="456" style="font-size:20px">specific</text>
<text x="462" y="520" style="font-size:36px;font-weight:700;fill:#8A6D12">6 weeks</text>
<line x1="600" y1="540" x2="600" y2="594" stroke="#B8952B" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah)"/>
<line x1="768" y1="450" x2="814" y2="450" stroke="#B8952B" stroke-width="3" marker-end="url(#ah)"/>
<rect x="820" y="282" width="316" height="258" fill="none" stroke="#B8952B" stroke-width="2.5"/>
<text class="cap gold" x="840" y="320">DEPLOYMENT 100</text>
<rect x="840" y="338" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="852" y="364" style="font-size:20px">automated</text>
<rect x="840" y="384" width="276" height="38" fill="#8A8B92" fill-opacity=".28"/><text class="mut" x="852" y="410" style="font-size:20px">automated</text>
<rect x="840" y="430" width="276" height="38" fill="#B8952B" fill-opacity=".22"/><text class="mut gold" x="852" y="456" style="font-size:20px">specific, always specific</text>
<text x="840" y="520" style="font-size:36px;font-weight:700;fill:#8A6D12">3 weeks</text>
<line x1="978" y1="540" x2="978" y2="594" stroke="#B8952B" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah)"/>
<rect x="64" y="620" width="1072" height="130" fill="#B8952B" fill-opacity=".12" stroke="#B8952B" stroke-width="2.5" stroke-dasharray="8 6"/>
<text class="cap gold" x="88" y="660">THE RETURN PATH · DEPLOYMENT LIBRARY</text>
<text class="body" x="88" y="696">Schema patterns · integration templates · exception structures ·</text>
<text class="body" x="88" y="726">handover scaffolding · failure-mode catalogue</text>
<rect x="64" y="790" width="520" height="280" fill="none" stroke="#8A8B92" stroke-width="2"/><text class="cap" x="88" y="830">WHAT COMPOUNDS</text>
<text class="body" x="88" y="872">Schema familiarity</text>
<text class="body" x="88" y="910">Integration scaffolding</text>
<text class="body" x="88" y="948">Exception-case templates</text>
<text class="body" x="88" y="986">Handover material</text>
<text class="body" x="88" y="1024">Failure-mode recognition</text>
<rect x="616" y="790" width="520" height="280" fill="none" stroke="#8A8B92" stroke-width="2"/><text class="cap red" x="640" y="830">WHAT NEVER DOES</text>
<text class="body" x="640" y="872">The wound itself</text>
<text class="body" x="640" y="910">The politics</text>
<text class="body" x="640" y="948">The owner</text>
<text class="body" x="640" y="986">The trust</text>
<line x1="64" y1="1110" x2="1136" y2="1110" stroke="#D2D1CD"/>
<text class="lab gold" x="64" y="1154">The model is a commodity. What sits around it, a hundred</text>
<text class="lab gold" x="64" y="1186">deployments’ worth of tested patterns, is not.</text>
<text class="mut" x="64" y="1226">Without the return path, forward deployment is consulting with better tools: linear in</text>
<text class="mut" x="64" y="1254">learning, no compounding. With it, the firm accumulates an asset that no single</text>
<text class="mut" x="64" y="1282">engagement could have justified building.</text>

</g>
</svg>
