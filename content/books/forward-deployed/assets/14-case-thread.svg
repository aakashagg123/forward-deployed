<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1260" width="1200" height="1260" role="img" aria-label="One build, six phases, from ungoverned scaffold to mature operation">
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1C1D20}
.kicker{font-size:18px;letter-spacing:3px;fill:#5A5B62;font-weight:700}
.h{font-size:36px;font-weight:700;letter-spacing:-.4px}
.cap{font-size:18px;letter-spacing:2.2px;font-weight:700}
.lab{font-size:24px;font-weight:700}
.body{font-size:22px}
.mut{font-size:20px;fill:#55565D}
.note{font-size:19px;fill:#55565D}
.red{fill:#B0432D}
.gold{fill:#8A6D12}
.inv{fill:#F7F6F3}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1200" height="1260" fill="#F7F6F3"/>
<text class="kicker" x="64" y="72">FIGURE 14.2 — ONE BUILD, SIX PHASES</text>
<text class="h" x="64" y="122">~5 months. A 7–16× compression, unevenly distributed.</text>
<line x1="64" y1="152" x2="1136" y2="152" stroke="#D2D1CD"/>
<g transform="translate(0,0)">
<text class="body" x="64" y="208" style="font-size:21px">~220K lines frontend · ~15K backend · 472 unit tests · 83 e2e specs</text>
<text class="body" x="64" y="240" style="font-size:21px">163 migrations · 20 domain-invariant lint rules</text>
<text class="mut" x="64" y="288">Baseline: 4–6 engineers, 12–18 months (48–108 person-months) → 5 calendar months actual</text>
<text class="cap" x="64" y="346" style="fill:#55565D">WEEK 1</text><text class="cap end" x="1136" y="346" style="fill:#55565D">~WEEK 21</text>
<rect x="64" y="362" width="169" height="48" fill="#B8952B" fill-opacity=".30" stroke="#B8952B" stroke-width="2.5"/><text class="lab mid" x="148" y="394" style="font-size:22px">0</text>
<rect x="239" y="362" width="145" height="48" fill="#8A8B92" fill-opacity=".20" stroke="#8A8B92" stroke-width="2.5"/><text class="lab mid" x="312" y="394" style="font-size:22px">1</text>
<rect x="390" y="362" width="99" height="48" fill="#B0432D" fill-opacity=".25" stroke="#B0432D" stroke-width="2.5"/><text class="lab mid" x="440" y="394" style="font-size:22px">2</text>
<rect x="495" y="362" width="145" height="48" fill="#8A8B92" fill-opacity=".20" stroke="#8A8B92" stroke-width="2.5"/><text class="lab mid" x="568" y="394" style="font-size:22px">3</text>
<rect x="647" y="362" width="250" height="48" fill="#B8952B" fill-opacity=".30" stroke="#B8952B" stroke-width="2.5"/><text class="lab mid" x="772" y="394" style="font-size:22px">4</text>
<rect x="903" y="362" width="99" height="48" fill="#B0432D" fill-opacity=".25" stroke="#B0432D" stroke-width="2.5"/><text class="lab mid" x="952" y="394" style="font-size:22px">5</text>
<rect x="1008" y="362" width="122" height="48" fill="#8A8B92" fill-opacity=".20" stroke="#8A8B92" stroke-width="2.5"/><text class="lab mid" x="1069" y="394" style="font-size:22px">6</text>
<rect x="64" y="460" width="12" height="52" fill="#B8952B"/><text class="cap" x="96" y="484" style="fill:#55565D">PHASE 0</text>
<text class="lab" x="260" y="484" style="font-size:22px;">Ungoverned scaffold</text>
<text class="mut" x="260" y="512">Prompt-to-app, fast</text>
<rect x="64" y="544" width="12" height="52" fill="#8A8B92"/><text class="cap" x="96" y="568" style="fill:#55565D">PHASE 1</text>
<text class="lab" x="260" y="568" style="font-size:22px;">Informal agent use</text>
<text class="mut" x="260" y="596">~6 weeks, ungoverned</text>
<rect x="64" y="628" width="12" height="52" fill="#B0432D"/><text class="cap" x="96" y="652" style="fill:#55565D">PHASE 2</text>
<text class="lab" x="260" y="652" style="font-size:22px;fill:#B0432D">Formalization</text>
<text class="mut" x="260" y="680">Dedicated sprint: did not compress</text>
<rect x="64" y="712" width="12" height="52" fill="#8A8B92"/><text class="cap" x="96" y="736" style="fill:#55565D">PHASE 3</text>
<text class="lab" x="260" y="736" style="font-size:22px;">Scoping failure</text>
<text class="mut" x="260" y="764">→ hard gate, within a month</text>
<rect x="64" y="796" width="12" height="52" fill="#B8952B"/><text class="cap" x="96" y="820" style="fill:#55565D">PHASE 4</text>
<text class="lab" x="260" y="820" style="font-size:22px;">Parallel production cycles</text>
<text class="mut" x="260" y="848">Wave-dispatch, fastest cadence</text>
<rect x="64" y="880" width="12" height="52" fill="#B0432D"/><text class="cap" x="96" y="904" style="fill:#55565D">PHASE 5</text>
<text class="lab" x="260" y="904" style="font-size:22px;fill:#B0432D">False-done incident</text>
<text class="mut" x="260" y="932">Found + fixed in ~1 day</text>
<rect x="64" y="964" width="12" height="52" fill="#8A8B92"/><text class="cap" x="96" y="988" style="fill:#55565D">PHASE 6</text>
<text class="lab" x="260" y="988" style="font-size:22px;">Mature operation</text>
<text class="mut" x="260" y="1016">Postmortem → rule, same week</text>
<line x1="64" y1="1090" x2="1136" y2="1090" stroke="#D2D1CD"/>
<text class="lab" x="64" y="1134">The gold phases compress. The red phases, governance design and the incident</text>
<text class="lab" x="64" y="1166">that tested it, took exactly as long as they took.</text>
<text class="mut" x="64" y="1206">Figures are the project’s own accounting, order-of-magnitude, not audited financials.</text>

</g>
</svg>
