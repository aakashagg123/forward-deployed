<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Line shaft factory versus unit drive factory">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#1C1D20}
.mut{font-size:14px;fill:#7A7B82}
.mc{font-size:15px;fill:#1C1D20}
.note{font-size:13px;fill:#7A7B82}
</style>
<rect width="1200" height="760" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 2.1 — THE SAME TECHNOLOGY, TWICE</text>
<text class="t h" x="64" y="112">Swap the power source, or rebuild around it</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>
<line x1="600" y1="176" x2="600" y2="640" stroke="#E4E3DF"/>

<!-- LEFT: line shaft -->
<text class="t col" x="64" y="204">1890s · NEW MOTOR, OLD ARCHITECTURE</text>
<text class="t note" x="64" y="228">The steam engine is replaced by one large electric motor.</text>

<!-- motor -->
<rect x="76" y="300" width="74" height="74" fill="none" stroke="#1C1D20" stroke-width="1.6"/>
<text class="t mc" x="113" y="344" text-anchor="middle">M</text>
<text class="t note" x="113" y="394" text-anchor="middle">one motor</text>
<!-- shaft -->
<line x1="76" y1="278" x2="556" y2="278" stroke="#1C1D20" stroke-width="5"/>
<text class="t note" x="556" y="264" text-anchor="end" fill="#7A7B82">overhead line shaft — runs or stops as one</text>
<line x1="113" y1="300" x2="113" y2="278" stroke="#1C1D20" stroke-width="2"/>
<!-- belts + machines, ordered by power draw not by flow -->
<g stroke="#8A8B92" stroke-width="1.4">
<line x1="212" y1="278" x2="212" y2="440"/><line x1="228" y1="278" x2="228" y2="440"/>
<line x1="292" y1="278" x2="292" y2="440"/><line x1="308" y1="278" x2="308" y2="440"/>
<line x1="372" y1="278" x2="372" y2="440"/><line x1="388" y1="278" x2="388" y2="440"/>
<line x1="452" y1="278" x2="452" y2="440"/><line x1="468" y1="278" x2="468" y2="440"/>
<line x1="532" y1="278" x2="532" y2="440"/><line x1="548" y1="278" x2="548" y2="440"/>
</g>
<g fill="none" stroke="#1C1D20" stroke-width="1.4">
<rect x="192" y="440" width="56" height="56"/>
<rect x="272" y="440" width="56" height="56"/>
<rect x="352" y="440" width="56" height="56"/>
<rect x="432" y="440" width="56" height="56"/>
<rect x="512" y="440" width="56" height="56"/>
</g>
<g class="t mc" text-anchor="middle" fill="#1C1D20">
<text x="220" y="475">3</text><text x="300" y="475">1</text><text x="380" y="475">5</text><text x="460" y="475">2</text><text x="540" y="475">4</text>
</g>
<text class="t note" x="64" y="546">Machines sit where the shaft can reach them.</text>
<text class="t note" x="64" y="570">Layout is dictated by power, so the work zig-zags: 3 → 1 → 5 → 2 → 4.</text>
<text class="t note" x="64" y="594">One machine cannot stop alone. The building is the transmission.</text>
<text class="t" x="64" y="632" font-size="15" fill="#C8553D">Result: negligible productivity gain.</text>

<!-- RIGHT: unit drive -->
<text class="t col" x="660" y="204">1920s · ARCHITECTURE REBUILT</text>
<text class="t note" x="660" y="228">Every machine gets its own motor. The shaft becomes unnecessary.</text>

<g fill="none" stroke="#1C1D20" stroke-width="1.4">
<rect x="656" y="300" width="56" height="56"/>
<rect x="756" y="360" width="56" height="56"/>
<rect x="856" y="300" width="56" height="56"/>
<rect x="956" y="360" width="56" height="56"/>
<rect x="1056" y="300" width="56" height="56"/>
</g>
<g fill="#B8952B">
<circle cx="656" cy="300" r="6"/><circle cx="756" cy="360" r="6"/><circle cx="856" cy="300" r="6"/><circle cx="956" cy="360" r="6"/><circle cx="1056" cy="300" r="6"/>
</g>
<g class="t mc" text-anchor="middle">
<text x="684" y="335">1</text><text x="784" y="395">2</text><text x="884" y="335">3</text><text x="984" y="395">4</text><text x="1084" y="335">5</text>
</g>
<defs><marker id="fw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B8952B"/></marker></defs>
<g stroke="#B8952B" stroke-width="1.6" fill="none" marker-end="url(#fw)">
<path d="M712 340 L 750 372"/>
<path d="M812 376 L 850 344"/>
<path d="M912 340 L 950 372"/>
<path d="M1012 376 L 1050 344"/>
</g>
<text class="t note" x="660" y="470" fill="#B8952B">flow of the work</text>

<text class="t note" x="660" y="546">Machines sit in the order the work happens.</text>
<text class="t note" x="660" y="570">Single storey, any width. The bottleneck becomes visible, so it can be balanced.</text>
<text class="t note" x="660" y="594">Each machine starts and stops alone. Supervision, maintenance and roles all change.</text>
<text class="t" x="660" y="632" font-size="15" fill="#B8952B">Result: the manufacturing productivity surge of the 1920s.</text>

<line x1="64" y1="676" x2="1136" y2="676" stroke="#D2D1CD"/>
<text class="t" x="64" y="712" font-size="16" fill="#4A4B50">A chat assistant bolted to an unchanged process is the left-hand panel.</text>
<text class="t note" x="64" y="736">The motor was never the gain. The rebuild was — and it was done factory by factory, by people standing on the floor.</text>
</svg>
