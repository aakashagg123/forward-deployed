<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The three layers of trust in a deployment">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.col{font-size:12.5px;letter-spacing:2.6px;fill:#1C1D20}
.note{font-size:13px;fill:#7A7B82}
.tick{font-size:11.5px;letter-spacing:1.4px;fill:#6A6B72}
.lbl{font-size:15px;fill:#1C1D20}
.desc{font-size:13.5px;fill:#7A7B82}
</style>
<rect width="1200" height="700" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 10.1 — THE THREE LAYERS OF TRUST</text>
<text class="t h" x="64" y="112">Competence first. Intention second. Structure last.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<!-- Layer 3: Structural (outermost, tallest) -->
<rect x="120" y="200" width="960" height="380" rx="10" fill="#EBEAE6" stroke="#C5C4C0"/>
<text class="t col" x="156" y="240">LAYER 3 · STRUCTURAL TRUST</text>
<text class="t desc" x="156" y="266">"This survives failure."</text>
<text class="t note" x="1044" y="240" text-anchor="end">Earned by surviving</text>
<text class="t note" x="1044" y="260" text-anchor="end">the first thing that goes wrong</text>

<!-- Layer 2: Intention (middle) -->
<rect x="200" y="296" width="800" height="240" rx="10" fill="#E4E3DF" stroke="#C5C4C0"/>
<text class="t col" x="236" y="336">LAYER 2 · INTENTION TRUST</text>
<text class="t desc" x="236" y="362">"They are here for the right reasons."</text>
<text class="t note" x="964" y="336" text-anchor="end">Earned by protecting</text>
<text class="t note" x="964" y="356" text-anchor="end">information shared in confidence</text>

<!-- Layer 1: Competence (innermost) -->
<rect x="300" y="392" width="600" height="100" rx="10" fill="#1C1D20"/>
<text class="t col" x="336" y="430" fill="#F7F6F3">LAYER 1 · COMPETENCE TRUST</text>
<text class="t desc" x="336" y="456" fill="#C5C4C0">"They can actually do the thing."</text>
<text class="t note" x="864" y="444" text-anchor="end" fill="#C5C4C0">Earned by shipping</text>

<!-- Timeline arrow at bottom -->
<line x1="180" y1="540" x2="1020" y2="540" stroke="#6A6B72" stroke-width="1.5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6A6B72"/></marker></defs>
<line x1="1010" y1="540" x2="1020" y2="540" stroke="#6A6B72" stroke-width="1.5" marker-end="url(#arr)"/>

<text class="t tick" x="180" y="566">WEEK 1</text>
<text class="t tick" x="500" y="566">MONTH 2</text>
<text class="t tick" x="760" y="566">MONTH 4</text>
<text class="t tick" x="1020" y="566" text-anchor="end">MONTH 6+</text>

<!-- Bracket labels under timeline -->
<line x1="180" y1="580" x2="420" y2="580" stroke="#B8952B" stroke-width="2"/>
<text class="t note" x="300" y="602" text-anchor="middle" fill="#B8952B">Ship something small</text>

<line x1="440" y1="580" x2="700" y2="580" stroke="#B8952B" stroke-width="2"/>
<text class="t note" x="570" y="602" text-anchor="middle" fill="#B8952B">Protect someone's truth</text>

<line x1="720" y1="580" x2="1020" y2="580" stroke="#B8952B" stroke-width="2"/>
<text class="t note" x="870" y="602" text-anchor="middle" fill="#B8952B">Survive the first failure together</text>

<line x1="64" y1="640" x2="1136" y2="640" stroke="#D2D1CD"/>
<text class="t" x="64" y="672" font-size="16" fill="#4A4B50">Skip a layer and the ones above it do not hold. Most operators try to build intention trust before earning competence trust.</text>
</svg>
