<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="The wound inventory versus the operator supply constraint">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:3.2px;fill:#6A6B72}
.h{font-size:30px;fill:#1C1D20}
.note{font-size:13px;fill:#7A7B82}
.lbl{font-size:15px;fill:#1C1D20}
.num{font-size:32px;fill:#1C1D20}
.unit{font-size:13px;fill:#6A6B72;letter-spacing:1.4px}
</style>
<rect width="1200" height="660" fill="#F7F6F3"/>
<text class="t kicker" x="64" y="70">FIGURE 15.2 — THE WOUND INVENTORY VS. THE OPERATOR SUPPLY</text>
<text class="t h" x="64" y="112">The constraint has never been addressable market.</text>
<line x1="64" y1="146" x2="1136" y2="146" stroke="#D2D1CD"/>

<!-- Large bar: wound inventory -->
<text class="t unit" x="64" y="200">ADDRESSABLE WOUND INVENTORY</text>
<rect x="64" y="216" width="1072" height="70" rx="8" fill="#EBEAE6" stroke="#D2D1CD"/>
<text class="t num" x="90" y="262">~75,000</text>
<text class="t note" x="300" y="262">deployable wounds — ~1,000 tier-1/2 enterprises × ~75 addressable workflows each</text>

<!-- Small bar: operator capacity -->
<text class="t unit" x="64" y="330">ANNUAL DEPLOYMENT CAPACITY, YEAR 10, AGGRESSIVE PIPELINE</text>
<rect x="64" y="346" width="56" height="70" rx="8" fill="#B8952B" opacity="0.2" stroke="#B8952B"/>
<text class="t num" x="140" y="392" fill="#B8952B">~3,500</text>
<text class="t note" x="300" y="392" fill="#B8952B">deployments/year — ~2,000 trained operators × 1.5–2 deployments each</text>

<!-- Ratio annotation -->
<line x1="120" y1="440" x2="120" y2="470" stroke="#C5C4C0" stroke-dasharray="3 3"/>
<text class="t note" x="120" y="490">~4.5% of the annual</text>
<text class="t note" x="120" y="508">inventory addressed</text>
<text class="t note" x="120" y="526">per year, at scale</text>

<line x1="64" y1="560" x2="1136" y2="560" stroke="#D2D1CD"/>
<text class="t" x="64" y="592" font-size="16" fill="#4A4B50">Multiple well-run firms could operate for a decade without meaningfully depleting the inventory. The strategic question is training speed, not client acquisition.</text>
<text class="t note" x="64" y="618">Figures are conservative, order-of-magnitude estimates built from Chapter 11's scaling curve and Chapter 13's market tiers — not a precision forecast.</text>
</svg>
