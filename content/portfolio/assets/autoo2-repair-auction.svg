<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="How AutoO2's repair auction system works">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:2.8px;fill:#8A8A8A}
.h{font-size:26px;font-weight:700;fill:#000000}
.step-lbl{font-size:12.5px;font-weight:700;letter-spacing:1.4px;fill:#000000}
.step-n{font-size:12px;font-weight:700;fill:#8A8A8A}
.note{font-size:14px;fill:#4A4A4A}
.small{font-size:12px;fill:#8A8A8A}
</style>
<rect width="1400" height="600" fill="#FFFFFF"/>
<text class="t kicker" x="40" y="48">THE REPAIR AUCTION SYSTEM</text>
<text class="t h" x="40" y="88">Reverse auction turns claim cost into a competition, not a fixed rate.</text>
<line x1="40" y1="110" x2="1360" y2="110" stroke="#D8D8D8"/>

<!-- Step boxes -->
<g>
  <!-- Step 1 -->
  <rect x="40" y="160" width="232" height="130" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text class="t step-n" x="62" y="190">01</text>
  <text class="t step-lbl" x="62" y="218">CLAIM</text>
  <text class="t step-lbl" x="62" y="236">INTIMATION</text>
  <text class="t note" x="62" y="264">Insured self-reports via</text>
  <text class="t note" x="62" y="282">OTP-verified policy no.</text>

  <!-- arrow -->
  <line x1="272" y1="225" x2="302" y2="225" stroke="#000000" stroke-width="1.4"/>
  <polygon points="302,219 312,225 302,231" fill="#000000"/>

  <!-- Step 2 -->
  <rect x="312" y="160" width="232" height="130" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text class="t step-n" x="334" y="190">02</text>
  <text class="t step-lbl" x="334" y="218">DAMAGE INFO</text>
  <text class="t step-lbl" x="334" y="236">CAPTURE</text>
  <text class="t note" x="334" y="264">Photos, accident detail,</text>
  <text class="t note" x="334" y="282">panel-wise damage</text>

  <line x1="544" y1="225" x2="574" y2="225" stroke="#000000" stroke-width="1.4"/>
  <polygon points="574,219 584,225 574,231" fill="#000000"/>

  <!-- Step 3 -->
  <rect x="584" y="160" width="232" height="130" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text class="t step-n" x="606" y="190">03</text>
  <text class="t step-lbl" x="606" y="218">REQUEST FOR</text>
  <text class="t step-lbl" x="606" y="236">BID</text>
  <text class="t note" x="606" y="264">AutoO2 publishes the job</text>
  <text class="t note" x="606" y="282">to the workshop network</text>

  <line x1="816" y1="225" x2="846" y2="225" stroke="#000000" stroke-width="1.4"/>
  <polygon points="846,219 856,225 846,231" fill="#000000"/>

  <!-- Step 4 -->
  <rect x="856" y="160" width="232" height="130" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text class="t step-n" x="878" y="190">04</text>
  <text class="t step-lbl" x="878" y="218">WORKSHOPS</text>
  <text class="t step-lbl" x="878" y="236">BID ON THE JOB</text>
  <text class="t note" x="878" y="264">3+ same-category shops</text>
  <text class="t note" x="878" y="282">quote, same job posted</text>

  <line x1="1088" y1="225" x2="1118" y2="225" stroke="#000000" stroke-width="1.4"/>
  <polygon points="1118,219 1128,225 1118,231" fill="#000000"/>

  <!-- Step 5 -->
  <rect x="1128" y="160" width="232" height="130" fill="#000000"/>
  <text class="t step-n" x="1150" y="190" fill="#8A8A8A">05</text>
  <text class="t step-lbl" x="1150" y="218" fill="#FFFFFF">BID WON</text>
  <text class="t note" x="1150" y="248" fill="#D8D8D8">Lowest qualified</text>
  <text class="t note" x="1150" y="266" fill="#D8D8D8">quote wins the</text>
  <text class="t note" x="1150" y="284" fill="#D8D8D8">claim job</text>
</g>

<!-- Note bar (stacked, not side-by-side, to avoid any column collision) -->
<rect x="40" y="330" width="1320" height="220" fill="none" stroke="#D8D8D8" stroke-width="1"/>

<text class="t small" x="64" y="364" letter-spacing="1.2">SCOPE</text>
<text class="t note" x="64" y="392">Applies to minor-damage claims under ₹20,000 in liability — the volume tier where a fixed</text>
<text class="t note" x="64" y="414">workshop rate leaves the most cost on the table.</text>

<line x1="64" y1="436" x2="1296" y2="436" stroke="#EDEDED"/>

<text class="t small" x="64" y="464" letter-spacing="1.2">RESULT</text>
<text class="t note" x="64" y="492">Cost reductions come from open-market competition among same-category workshops for</text>
<text class="t note" x="64" y="514">each job.</text>
</svg>
