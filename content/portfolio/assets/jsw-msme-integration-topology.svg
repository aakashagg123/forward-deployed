<text class="t s" x="490.0" y="457" text-anchor="middle" style="fill:#4A4A4A">email · WhatsApp Business</text>
<line x1="490.0" y1="338" x2="490.0" y2="410" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="700" y="410" width="220" height="64" rx="3" style="fill:#FFFFFF" stroke="#8A8A8A" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="t n" x="810.0" y="439" text-anchor="middle" style="fill:#000000">Ledger &amp; credit</text>
