<line x1="280" y1="294.0" x2="380" y2="294.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="600" y1="294.0" x2="700" y2="294.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="920" y1="294.0" x2="1020" y2="294.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
