</style>
<rect width="1400" height="540" style="fill:#FFFFFF"/>
<text class="t kicker" x="40" y="48">INTEGRATION TOPOLOGY</text>
<text class="t h" x="40" y="88">The order engine sits between the storefront and two systems of record.</text>
