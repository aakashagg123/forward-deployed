<text class="t s" x="170.0" y="309" text-anchor="middle" style="fill:#4A4A4A">jswonemsme.com</text>
<rect x="380" y="250" width="220" height="88" rx="3" style="fill:#000000"/>
<text class="t n" x="490.0" y="291" text-anchor="middle" style="fill:#FFFFFF">Order engine</text>
<text class="t s" x="490.0" y="309" text-anchor="middle" style="fill:#D8D8D8">booking core · OCC flow</text>
<rect x="700" y="250" width="220" height="88" rx="3" style="fill:#FFFFFF" stroke="#000000" stroke-width="1.4"/>
<text class="t n" x="810.0" y="291" text-anchor="middle" style="fill:#000000">Salesforce CRM</text>
<text class="t s" x="810.0" y="309" text-anchor="middle" style="fill:#4A4A4A">opportunity to order</text>
<rect x="1020" y="250" width="220" height="88" rx="3" style="fill:#FFFFFF" stroke="#000000" stroke-width="1.4"/>
<text class="t n" x="1130.0" y="283" text-anchor="middle" style="fill:#000000">ERP</text>
<text class="t s" x="1130.0" y="301" text-anchor="middle" style="fill:#4A4A4A">fulfilment · shipment</text>
