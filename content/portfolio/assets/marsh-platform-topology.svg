<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" role="img" aria-label="Marsh platform topology: partner programs through QoverPro, employer network through BenefitsCircle, with a shared chatbot layer">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A4A4A"/></marker>
</defs>
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:2.8px;fill:#8A8A8A}
.h{font-size:26px;font-weight:700;fill:#000000}
.n{font-size:15px;font-weight:700}
.s{font-size:12px}
.chip{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#8A8A8A}
.e{font-size:11.5px;fill:#4A4A4A}
</style>
<rect width="1400" height="480" style="fill:#FFFFFF"/>
<text class="t kicker" x="40" y="48">PLATFORM TOPOLOGY</text>
<text class="t h" x="40" y="88">Two platforms, three chatbot use-cases.</text>
<line x1="40" y1="110" x2="1360" y2="110" stroke="#D8D8D8"/>

<text class="t chip" x="40" y="140" text-anchor="start">EMBEDDED INSURANCE</text>
<rect x="60" y="160" width="260" height="96" rx="3" style="fill:#FFFFFF" stroke="#000000" stroke-width="1.4"/>
<text class="t n" x="190.0" y="197" text-anchor="middle" style="fill:#000000">Partner programs</text>
<text class="t s" x="190.0" y="215" text-anchor="middle" style="fill:#4A4A4A">Amazon DSP · Ashok Leyland</text>
<text class="t s" x="190.0" y="231" text-anchor="middle" style="fill:#4A4A4A">Cleartrip · Shiprocket · Bridgestone</text>
<rect x="450" y="160" width="260" height="96" rx="3" style="fill:#000000"/>
<text class="t n" x="580.0" y="205" text-anchor="middle" style="fill:#FFFFFF">QoverPro</text>
<text class="t s" x="580.0" y="223" text-anchor="middle" style="fill:#D8D8D8">embedded insurance platform</text>
<rect x="840" y="160" width="300" height="96" rx="3" style="fill:#FFFFFF" stroke="#000000" stroke-width="1.4"/>
<text class="t n" x="990.0" y="197" text-anchor="middle" style="fill:#000000">Cover propositions</text>
<text class="t s" x="990.0" y="215" text-anchor="middle" style="fill:#4A4A4A">pet · trip protection · renters</text>
<text class="t s" x="990.0" y="231" text-anchor="middle" style="fill:#4A4A4A">EV charging · cyber · personal accident</text>
<line x1="320" y1="208.0" x2="450" y2="208.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="710" y1="208.0" x2="840" y2="208.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)"/>
<text class="t chip" x="40" y="310" text-anchor="start">VOLUNTARY BENEFITS</text>
<rect x="60" y="330" width="260" height="96" rx="3" style="fill:#FFFFFF" stroke="#000000" stroke-width="1.4"/>
<text class="t n" x="190.0" y="375" text-anchor="middle" style="fill:#000000">Employer network</text>
<text class="t s" x="190.0" y="393" text-anchor="middle" style="fill:#4A4A4A">employers and employees</text>
<rect x="450" y="330" width="260" height="96" rx="3" style="fill:#000000"/>
<text class="t n" x="580.0" y="367" text-anchor="middle" style="fill:#FFFFFF">BenefitsCircle</text>
<text class="t s" x="580.0" y="385" text-anchor="middle" style="fill:#D8D8D8">voluntary benefits platform</text>
<text class="t s" x="580.0" y="401" text-anchor="middle" style="fill:#D8D8D8">e-insurance website</text>
<rect x="840" y="330" width="300" height="96" rx="3" style="fill:#FFFFFF" stroke="#000000" stroke-width="1.4"/>
<text class="t n" x="990.0" y="375" text-anchor="middle" style="fill:#000000">Employees</text>
<text class="t s" x="990.0" y="393" text-anchor="middle" style="fill:#4A4A4A">5M lives reached</text>
<line x1="320" y1="378.0" x2="450" y2="378.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="710" y1="378.0" x2="840" y2="378.0" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="1210" y="160" width="150" height="266" rx="3" style="fill:#FFFFFF" stroke="#8A8A8A" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="t n" x="1285.0" y="258" text-anchor="middle" style="fill:#000000">Chatbot layer</text>
<text class="t s" x="1285.0" y="276" text-anchor="middle" style="fill:#4A4A4A">three productised</text>
<text class="t s" x="1285.0" y="292" text-anchor="middle" style="fill:#4A4A4A">use-cases across</text>
<text class="t s" x="1285.0" y="308" text-anchor="middle" style="fill:#4A4A4A">digital insurance</text>
<text class="t s" x="1285.0" y="324" text-anchor="middle" style="fill:#4A4A4A">affinity and</text>
<text class="t s" x="1285.0" y="340" text-anchor="middle" style="fill:#4A4A4A">voluntary benefits</text>
<line x1="1140" y1="208.0" x2="1210" y2="208.0" stroke="#4A4A4A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="1140" y1="378.0" x2="1210" y2="378.0" stroke="#4A4A4A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
