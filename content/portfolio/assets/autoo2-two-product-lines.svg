<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="1400" height="680" role="img" aria-label="AutoO2's two product lines sharing one workshop network">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:2.8px;fill:#8A8A8A}
.h{font-size:26px;font-weight:700;fill:#000000}
.col-h{font-size:15px;font-weight:700;letter-spacing:1.6px;fill:#000000}
.item{font-size:14px;fill:#4A4A4A}
.small{font-size:12px;fill:#8A8A8A}
</style>
<rect width="1400" height="680" fill="#FFFFFF"/>
<text class="t kicker" x="40" y="48">TWO PRODUCT LINES, ONE NETWORK</text>
<text class="t h" x="40" y="88">A consumer marketplace and an enterprise claims stack, built side by side.</text>
<line x1="40" y1="110" x2="1360" y2="110" stroke="#D8D8D8"/>

<!-- Left column: consumer -->
<rect x="40" y="140" width="608" height="350" fill="none" stroke="#000000" stroke-width="1.4"/>
<text class="t col-h" x="64" y="178">CONSUMER MARKETPLACE</text>
<text class="t small" x="64" y="200">AutoO2 Platform — for vehicle owners</text>
<line x1="64" y1="216" x2="624" y2="216" stroke="#D8D8D8"/>
<g class="t item">
  <text x="64" y="250">•  Book a service — custom packages by make/model and mileage</text>
  <text x="64" y="282">•  Upload damage photos, get competitive workshop quotes</text>
  <text x="64" y="314">•  In-progress service and repair tracking, with alerts</text>
  <text x="64" y="346">•  Service history and user profile, kept for every future visit</text>
  <text x="64" y="378">•  Denting/painting, repair, car wash and detailing</text>
</g>
<text class="t small" x="64" y="460">Live in Delhi/NCR and Mumbai at launch.</text>

<!-- Right column: enterprise -->
<rect x="752" y="140" width="608" height="350" fill="#000000"/>
<text class="t col-h" x="776" y="178" fill="#FFFFFF">ENTERPRISE CLAIMS STACK</text>
<text class="t small" x="776" y="200" fill="#B8B8B8">AutoO2 ARAS + Claims Cloud — for insurers, brokers, fleets</text>
<line x1="776" y1="216" x2="1336" y2="216" stroke="#4A4A4A"/>
<g class="t item">
  <text x="776" y="250" fill="#D8D8D8">•  Electronic notice of loss (ENOL) — self-reported, photo-driven</text>
  <text x="776" y="282" fill="#D8D8D8">•  Remote damage assessment, replacing manual surveyor visits</text>
  <text x="776" y="314" fill="#D8D8D8">•  Claim job auctions for cost-controlled repair settlement</text>
  <text x="776" y="346" fill="#D8D8D8">•  Direct-to-workshop or cash-in-lieu claim settlement</text>
  <text x="776" y="378" fill="#D8D8D8">•  Service-management web app + API for insurer integration</text>
</g>
<text class="t small" x="776" y="460" fill="#8A8A8A">Exclusive digital-claims mandates with 2 insurers.</text>

<!-- convergence -->
<line x1="352" y1="490" x2="700" y2="560" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="1048" y1="490" x2="700" y2="560" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="460" y="560" width="480" height="68" fill="none" stroke="#000000" stroke-width="1.4"/>
<text class="t col-h" x="700" y="592" text-anchor="middle">500+ NETWORK WORKSHOPS</text>
<text class="t small" x="700" y="614" text-anchor="middle">Delhi, Ghaziabad, Mumbai, Surat, Ahmedabad, Vadodara</text>
</svg>
