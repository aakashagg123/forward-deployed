<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="AutoO2's two product lines sharing one workshop network">
<style>
.t{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.kicker{font-size:12px;letter-spacing:2.6px;fill:#8A8A8A}
.h{font-size:22px;font-weight:700;fill:#000000}
.col-h{font-size:13px;font-weight:700;letter-spacing:1.6px;fill:#000000}
.item{font-size:13px;fill:#4A4A4A}
.small{font-size:11px;fill:#8A8A8A}
</style>
<rect width="1160" height="560" fill="#FFFFFF"/>
<text class="t kicker" x="40" y="42">TWO PRODUCT LINES, ONE NETWORK</text>
<text class="t h" x="40" y="76">A consumer marketplace and an enterprise claims stack, built side by side.</text>
<line x1="40" y1="98" x2="1120" y2="98" stroke="#D8D8D8"/>

<!-- Left column: consumer -->
<rect x="40" y="130" width="500" height="290" fill="none" stroke="#000000" stroke-width="1.4"/>
<text class="t col-h" x="64" y="164">CONSUMER MARKETPLACE</text>
<text class="t small" x="64" y="184">AutoO2 Platform — for vehicle owners</text>
<line x1="64" y1="198" x2="516" y2="198" stroke="#D8D8D8"/>
<g class="t item">
  <text x="64" y="226">•  Book a service — custom packages by make/model and mileage</text>
  <text x="64" y="252">•  Upload damage photos, get competitive workshop quotes</text>
  <text x="64" y="278">•  In-progress service and repair tracking, with alerts</text>
  <text x="64" y="304">•  Service history and user profile, kept for every future visit</text>
  <text x="64" y="330">•  Denting/painting, repair, car wash and detailing</text>
</g>
<text class="t small" x="64" y="384">Live in Delhi/NCR and Mumbai at launch.</text>

<!-- Right column: enterprise -->
<rect x="620" y="130" width="500" height="290" fill="#000000"/>
<text class="t col-h" x="644" y="164" fill="#FFFFFF">ENTERPRISE CLAIMS STACK</text>
<text class="t small" x="644" y="184" fill="#B8B8B8">AutoO2 ARAS + Claims Cloud — for insurers, brokers, fleets</text>
<line x1="644" y1="198" x2="1096" y2="198" stroke="#4A4A4A"/>
<g class="t item" fill="#D8D8D8">
  <text x="644" y="226" fill="#D8D8D8">•  Electronic notice of loss (ENOL) — self-reported, photo-driven</text>
  <text x="644" y="252" fill="#D8D8D8">•  Remote damage assessment, replacing manual surveyor visits</text>
  <text x="644" y="278" fill="#D8D8D8">•  Claim job auctions for cost-controlled repair settlement</text>
  <text x="644" y="304" fill="#D8D8D8">•  Direct-to-workshop or cash-in-lieu claim settlement</text>
  <text x="644" y="330" fill="#D8D8D8">•  Service-management web app + API for insurer integration</text>
</g>
<text class="t small" x="644" y="384" fill="#8A8A8A">Exclusive digital-claims mandates with 2 insurers.</text>

<!-- convergence -->
<line x1="290" y1="420" x2="580" y2="480" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="870" y1="420" x2="580" y2="480" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="380" y="480" width="400" height="56" fill="none" stroke="#000000" stroke-width="1.4"/>
<text class="t col-h" x="580" y="504" text-anchor="middle">500+ NETWORK WORKSHOPS</text>
<text class="t small" x="580" y="524" text-anchor="middle">Delhi, Ghaziabad, Mumbai, Surat, Ahmedabad, Vadodara</text>
</svg>
