<style>
  :root{
    --bg:#fafbfc;--surface:#ffffff;--ink:#1f2328;--ink2:#1f2328;--muted:#59636e;
    --accent:#0969da;--accent-deep:#0550ae;--line:#d1d9e0;--soft:#f6f8fa;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;

    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
    gap:16px;padding:12px 20px;background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(31,35,40,.02),0 4px 16px rgba(31,35,40,.03)}
  .bar .back{font-weight:500;color:var(--ink);white-space:nowrap}
  .bar .back:hover{color:var(--accent-deep)}
  .bar .brand{font-weight:600;color:var(--accent-deep);white-space:nowrap}
  #search{flex:1;min-width:60px;max-width:340px;padding:7px 12px;border:1px solid var(--line);
    border-radius:6px;background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
  #search:focus{outline:2px solid rgba(9,105,218,.45);outline-offset:1px}
  .tgl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;
    white-space:nowrap;cursor:pointer;user-select:none}
  #listBtn{margin-left:auto;padding:7px 13px;border:1px solid var(--line);border-radius:6px;
    background:var(--surface);font:inherit;font-size:13.5px;font-weight:500;color:var(--ink2);
    cursor:pointer}
  #listBtn:hover{border-color:var(--accent)}

  #legend{position:fixed;left:14px;bottom:14px;z-index:25;display:flex;flex-direction:column;
    gap:3px;padding:14px 16px;background:rgba(255,255,255,.97);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 28px rgba(31,35,40,.10),0 1px 3px rgba(31,35,40,.04);max-width:280px}
  #legend .lg-h{font-size:11px;font-weight:600;letter-spacing:.03em;
    color:var(--muted);margin-bottom:5px}
  .chip{display:flex;align-items:center;gap:8px;padding:3px 6px;margin:0 -6px;border:0;
    background:none;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;
    border-radius:7px;text-align:left}
  .chip:hover{background:var(--soft)}
  .chip .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .chip .n{margin-left:auto;color:var(--muted);font-size:12px}
  .chip.off{opacity:.38}
  .chip.off .dot{background:var(--muted) !important}

  #cv{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
  #cv.dragging{cursor:grabbing}
  #cv.overnode{cursor:pointer}
  #cv3d{position:fixed;inset:0;display:none}

  #tip{position:fixed;z-index:40;pointer-events:none;display:none;max-width:290px;
    padding:8px 12px;background:var(--ink);color:#ffffff;border-radius:6px;
    font-size:13px;line-height:1.45;box-shadow:0 8px 24px rgba(31,35,40,.25)}
  #tip .t-track{display:block;font-size:11px;opacity:.75;margin-top:2px}

  #card{position:fixed;right:14px;bottom:14px;z-index:25;width:320px;max-width:calc(100vw - 28px);
    max-height:46vh;overflow:auto;padding:18px 20px;background:rgba(255,255,255,.98);
    border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 32px rgba(31,35,40,.12),0 2px 6px rgba(31,35,40,.05);
    display:none}

  #card h2{margin:.25em 0 .4em;font-size:17px;line-height:1.3;letter-spacing:-.01em}
  #card .c-open{display:inline-block;margin:2px 0 10px;font-weight:500;font-size:13.5px}
  #card .c-h{font-size:11px;font-weight:600;letter-spacing:.03em;
    color:var(--muted);margin:10px 0 4px}
  #card ul{list-style:none;margin:0;padding:0}
  #card li{padding:2px 0;font-size:13px;line-height:1.4}
  #card li a{color:var(--ink2)}
  #card li a:hover{color:var(--accent-deep)}
  #card .c-close{position:sticky;top:0;float:right;border:0;background:none;color:var(--muted);
    font-size:17px;cursor:pointer;padding:0 0 4px 8px;font-family:inherit}

  #panel{position:fixed;top:0;right:0;bottom:0;z-index:35;width:360px;max-width:92vw;
    background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(31,35,40,.08);
    transform:translateX(105%);transition:transform .22s ease;overflow:auto;padding:18px 22px 40px}
  #panel.open{transform:none}
  #panel .p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  #panel h2{font-size:16px;margin:0}
  #panel .p-close{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;font-family:inherit}
  #panel details{border-top:1px solid var(--line);padding:8px 0}
  #panel summary{cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;padding:4px 0}
  #panel summary .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  #panel ul{list-style:none;margin:6px 0;padding:0 0 0 17px}
  #panel li{padding:2.5px 0;font-size:13.5px;line-height:1.45}
  #panel li a{color:var(--ink2)}
  #panel li a:hover{color:var(--accent-deep)}

  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
    color:var(--muted);font-size:12.5px;background:rgba(255,255,255,.9);padding:4px 12px;
    border:1px solid var(--line);border-radius:999px;pointer-events:none;transition:opacity .5s;white-space:nowrap}

  @media (max-width:720px){
    .bar{gap:10px;padding:10px 12px}
    .bar .brand{display:none}
    .tgl span{display:none}
    #hint{display:none}
    /* legend + card become full-width bottom sheets on phones, for either renderer */
    #legend{left:0;right:0;bottom:0;top:auto;max-width:100%;width:100%;
      border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0;
      max-height:34vh;overflow:auto;flex-direction:row;flex-wrap:wrap;gap:6px 14px}
    #legend .lg-h{width:100%;margin-bottom:2px}
    #card{left:0;right:0;bottom:0;top:auto;width:100%;max-width:100%;
      border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0;max-height:52vh}
  }
</style></head>

    if (pointers.size === 2) {                        // pinch zoom
      const [p, q] = [...pointers.values()];
      const d = Math.hypot(p.x - q.x, p.y - q.y), mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      if (pinchD > 0) zoomAt(mx, my, d / pinchD);
      pinchD = d;
      return;
    }
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y) > 0 &&
        (dragNode || panning)) {
      if (Math.hypot(dx, dy) > 2) moved = true;
      if (dragNode) {
        const [wx, wy] = toWorld(e.clientX, e.clientY);
        dragNode.x = wx; dragNode.y = wy; reheat(.28);
      } else if (panning) { view.x += dx; view.y += dy; }
      last = {x: e.clientX, y: e.clientY};
    } else if (!pointers.size) {                      // hover
      const n = nodeAt(e.clientX, e.clientY);
      if (n !== hoverN) { hoverN = n; }
      cv.classList.toggle("overnode", !!n);
      if (n && e.pointerType !== "touch") {
        tip.style.display = "block";
        tip.innerHTML = esc(n.title) +
          '<span class="t-track">' +
          esc(trackOf[n.track].label) + " · " + deg[n.i] + " connections</span>";
        const tw = tip.offsetWidth;
        tip.style.left = Math.min(W - tw - 10, e.clientX + 14) + "px";
        tip.style.top = (e.clientY + 16) + "px";
      } else tip.style.display = "none";
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    cv.classList.remove("dragging");
    if (pointers.size < 2) pinchD = 0;
    const n = dragNode;
    if (n) n.fixed = false;
    if (!moved && e.type === "pointerup") {           // click / tap
      const hit = n || nodeAt(e.clientX, e.clientY);
      if (hit) {
        if (e.pointerType === "touch" && selN !== hit) select(hit);   // tap: select first
        else window.location.href = "../" + hit.url;                  // click / 2nd tap: open
      } else { select(null); }
    }
    dragNode = null; panning = false;
  }
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", endPointer);
  cv.addEventListener("pointerleave", () => { hoverN = null; tip.style.display = "none"; });

  function zoomAt(sx, sy, f) {
    const k = Math.max(.18, Math.min(6, view.k * f));
    const r = k / view.k;
    view.x = sx - (sx - view.x) * r; view.y = sy - (sy - view.y) * r;
    view.k = k;
  }
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0016));
  }, {passive: false});

  function fit() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes) {
      if (!visN(n)) continue;
      x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x);
      y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y);
    }
    if (x0 > x1) return;
    const pad = 70, top = 58;
    const k = Math.max(.2, Math.min(1.4,
      Math.min((W - pad * 2) / (x1 - x0 + 1), (H - top - pad * 2) / (y1 - y0 + 1))));
    view.k = k;
    view.x = W / 2 - (x0 + x1) / 2 * k;
    view.y = top + (H - top) / 2 - (y0 + y1) / 2 * k;
  }
  cv.addEventListener("dblclick", e => { if (!nodeAt(e.clientX, e.clientY)) fit(); });

  /* boot: warm layout, honor ?focus= */
  for (let i = 0; i < 220; i++) tick();
  fit();
  if (focusNode) {
    select(focusNode);
    view.k = 1.6; view.x = W / 2 - focusNode.x * view.k; view.y = H / 2 - focusNode.y * view.k;
  }
  hintEl.textContent = "scroll to zoom · drag to pan · click a node to open its page · double-click to re-fit";
  setTimeout(() => { hintEl.style.opacity = "0"; }, 6000);
  loop();
}

/* =====================================================================
   3D renderer — real spatial depth via the 3d-force-graph library
   (three.js + d3-force-3d), loaded from a CDN. Everything here is
   additive: if any part of this fails, the dispatcher below falls back
   to the untouched boot2D() above.
   ===================================================================== */
function boot3D() {
  const el = document.getElementById("cv3d");
  document.getElementById("cv").style.display = "none";
  el.style.display = "block";

  function buildNodes() { return nodes.filter(visN); }
  function buildLinks() {
    const out = [];
    for (const e of edges) {
      if (!visE(e)) continue;
      out.push({source: nodes[e[0]], target: nodes[e[1]], weight: e[2], kind: e[3]});
    }
    return out;
  }
  function nodeColor(n) {
    return searchSet && !searchSet.has(n.i) ? fade(n.color) : n.color;
  }
  function linkColor(l) {
    const dim = searchSet && !(searchSet.has(l.source.i) || searchSet.has(l.target.i));
    return dim ? "rgba(140,149,159,.15)" : (l.kind === "link" ? "#8c959f" : "#aab1b8");
  }

  const Graph = ForceGraph3D()(el)
    .graphData({nodes: buildNodes(), links: buildLinks()})
    .width(window.innerWidth)
    .height(window.innerHeight)
    .backgroundColor("#fafbfc")
    .showNavInfo(false)
    .nodeId("id")
    .nodeColor(nodeColor)
    .nodeVal(n => n.r)
    .nodeResolution(24)                             // smoother spheres — cheap
    .nodeOpacity(.98)
    .nodeLabel(n => esc(n.title) +
      '<span class="t-track">' + esc(trackOf[n.track].label) + " · " + deg[n.i] + " connections</span>")
    .linkColor(linkColor)
    .linkWidth(l => l.kind === "link" ? 1.1 + Math.min(4, l.weight) * .35 : 1.0)
    .linkOpacity(.42)
    .onNodeClick(n => select(n));

  // Nudge three.js to render at real device-pixel density for a crisp 2K feel.
  try {
    const r = Graph.renderer && Graph.renderer();
    if (r && typeof r.setPixelRatio === "function") {
      r.setPixelRatio(Math.min(3, Math.max(2, window.devicePixelRatio || 1)));
    }
  } catch (e) { /* library minor version differences: no-op */ }

  window.addEventListener("resize", () => {
    Graph.width(window.innerWidth).height(window.innerHeight);
  });

  onFilterChange = () => {
    if (selN && !visN(selN)) select(null);
    Graph.graphData({nodes: buildNodes(), links: buildLinks()});
  };
  onSearchChange = () => { Graph.refresh(); };

  if (focusNode) {
    select(focusNode);
    Graph.onEngineStop(() => {
      Graph.cameraPosition({x: focusNode.x, y: focusNode.y, z: (focusNode.z || 0) + 160}, focusNode, 1000);
    });
  } else {
    Graph.onEngineStop(() => { Graph.zoomToFit(600, 60); });
  }
  hintEl.textContent = "drag to rotate · scroll to zoom · two fingers to pan · tap a node to open its card";
  setTimeout(() => { hintEl.style.opacity = "0"; }, 6000);

  // Live performance safety net: a device that can't sustain a reasonable
  // frame rate once 3D is actually running falls back to 2D, rather than
  // being stuck with a stuttering view. No pre-show trial (the library
  // documents no teardown/destructor for a discarded probe instance), so
  // this checks the real, visible instance shortly after boot instead.
  let last = performance.now(), samples = [];
  function sample(t) {
    samples.push(t - last); last = t;
    if (samples.length < 90) { requestAnimationFrame(sample); return; }
    const avg = samples.slice(20).reduce((a, b) => a + b, 0) / (samples.length - 20);
    if (avg > 55) {  // sustained < ~18fps: this device can't keep up
      el.style.display = "none";
      el.innerHTML = "";
      document.getElementById("cv").style.display = "block";
      onFilterChange = () => {}; onSearchChange = () => {};
      boot2D();
    }
  }
  requestAnimationFrame(sample);
}

/* ---------- capability detection + dispatcher ---------- */
function webglOK() {
  try {
    const c = document.createElement("canvas");
    return !!(window.WebGLRenderingContext &&
      (c.getContext("webgl") || c.getContext("experimental-webgl")));
  } catch (e) { return false; }
}
function reducedMotion() {
  return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function lowPowerMobile() {
  const narrow = window.matchMedia && matchMedia("(max-width:820px)").matches;
  const fewCores = typeof navigator.hardwareConcurrency === "number" && navigator.hardwareConcurrency < 4;
  const lowMem = typeof navigator.deviceMemory === "number" && navigator.deviceMemory < 4;
  return narrow && (fewCores || lowMem);
}
function canTry3D() { return webglOK() && !reducedMotion() && !lowPowerMobile(); }

function loadScript(src, timeoutMs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; reject(new Error("timeout")); } }, timeoutMs);
    s.src = src;
    s.onload = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
    s.onerror = () => { if (!done) { done = true; clearTimeout(t); reject(new Error("load error")); } };
    document.head.appendChild(s);
  });
}

(async function boot() {
  if (!canTry3D()) { boot2D(); return; }
  try {
    await loadScript("3d-force-graph.min.js", 4000);
    if (typeof window.ForceGraph3D !== "function") throw new Error("3d-force-graph global missing");
    boot3D();
  } catch (e) {
    // boot3D() may have partially run (e.g. hidden #cv before a later chained
    // call threw) — reset both containers to a clean slate before falling back.
    const el = document.getElementById("cv3d");
    el.style.display = "none"; el.innerHTML = "";
    document.getElementById("cv").style.display = "block";
    boot2D();
  }
})();
</script>
</body></html>
